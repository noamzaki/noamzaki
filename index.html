          <button class="btn ghost" data-act="bill-clear">Clear</button>
        </div>
      </div>
    </div>
  </div>`;
};

function billTotalsHTML(b, t, custBal) {
  const paid = Math.min(num(b.paidNow), t.grand);
  const pending = round2(t.grand - paid);
  return `
    <div class="tot-row"><span>Items total (${b.lines.length})</span><b>${money(t.gross)}</b></div>
    ${t.itemDiscount ? `<div class="tot-row"><span>Item discounts</span><b>-${money(t.itemDiscount)}</b></div>` : ''}
    ${t.billDiscount ? `<div class="tot-row"><span>Bill discount</span><b>-${money(t.billDiscount)}</b></div>` : ''}
    ${S.settings.taxEnabled ? `<div class="tot-row"><span>Taxable value</span><b>${money(t.subtotal)}</b></div>
      <div class="tot-row"><span>GST</span><b>${money(t.tax)}</b></div>${S.settings.priceIncludesTax ? '<div class="note-line">Rates are tax-inclusive</div>' : ''}` : ''}
    ${t.roundOff ? `<div class="tot-row"><span>Round off</span><b>${t.roundOff > 0 ? '+' : '-'}${money(Math.abs(t.roundOff), false)}</b></div>` : ''}
    <div class="tot-row grand"><span>Grand total</span><b>${money(t.grand)}</b></div>
    ${paid > 0 ? `<div class="tot-row ok-t"><span>Received now</span><b>${money(paid)}</b></div>` : ''}
    <div class="tot-row ${pending > 0 ? 'warn-t' : 'ok-t'}"><span>${pending > 0 ? 'Goes to khata (pending)' : 'Fully paid'}</span><b>${money(Math.max(0, pending))}</b></div>
    ${custBal ? `<div class="tot-row muted"><span>Khata balance after this bill</span><b>${money(custBal + pending)}</b></div>` : ''}
    <div class="tot-row muted small"><span>Qty in bill</span><b>${qtyFmt(t.qty)}</b></div>`;
}

/* ---- billing interactions ---- */
function refreshBill() {
  const b = S.bill;
  const t = computeInvoice(b.lines, b.disc, taxOpts()).totals;
  const cust = findCustomer(b.customerId);
  const custBal = cust ? customerBalance(cust, S.invoices, S.payments) : 0;
  const host = document.getElementById('bill-totals');
  if (host) host.innerHTML = billTotalsHTML(b, t, custBal);
  b.lines.forEach((l, i) => {
    const el = document.getElementById('lt_' + i);
    if (el) el.textContent = money(computeLine(l, taxOpts()).total);
  });
}

ACTIONS['bill-customer'] = (el) => { S.bill.customerId = el.value; render(); };
ACTIONS['cust-modal-from-bill'] = () => customerModal(null, () => render());

ACTIONS['bill-field'] = (el) => {
  const f = el.dataset.f;
  let v = el.value;
  if (f === 'paidNow') v = num(v);
  S.bill[f] = v;
  if (['paidNow', 'no', 'note', 'date'].includes(f)) refreshBill();
  if (f === 'no') S.bill.no = v;
};

ACTIONS['bill-disc'] = (el) => {
  const b = S.bill;
  b.disc[el.dataset.f] = el.dataset.f === 'value' ? num(el.value) : el.value;
  if (el.dataset.f === 'type') {
    const input = document.querySelector('[data-input="bill-disc"]');
    if (input) input.disabled = b.disc.type === 'none';
  }
  refreshBill();
};

ACTIONS['bill-line'] = (el, ev) => {
  const i = +el.dataset.i, f = el.dataset.f;
  const l = S.bill.lines[i];
  if (!l) return;
  if (f === 'sellUnit') {
    const p = findProduct(l.productId);
    l.sellUnit = el.value;
    if (p && el.value === 'box' && num(p.ppb) > 1) l.rate = round2(num(p.price) * num(p.ppb));
    if (p && el.value !== 'box') l.rate = num(p.price);
    render();
    return;
  }
  if (['qty', 'rate', 'discPct', 'gstPct'].includes(f)) l[f] = num(el.value);
  if (f === 'name') l.name = el.value;
  refreshBill();
};

ACTIONS['bill-remove-line'] = (el) => {
  S.bill.lines.splice(+el.dataset.i, 1);
  render();
};

ACTIONS['bill-save'] = async () => {
  if (!requirePerm('bill', 'make bills')) return;
  const b = S.bill;
  if (!b.lines.length) return UI.toast('Add at least one item', 'warn');
  const cust = findCustomer(b.customerId);
  const calc = computeInvoice(b.lines, b.disc, taxOpts());
  const t = calc.totals;
  const paidNow = Math.min(num(b.paidNow), t.grand);
  const inv = {
    id: b.id, no: b.no || nextBillNo(), date: b.date || todayISO(),
    customerId: b.customerId || '', customerName: cust ? cust.name : 'Cash',
    lines: calc.rows.map((r, i) => ({
      productId: r.productId, name: r.name, hsn: r.hsn, unit: r.unit, sellUnit: r.sellUnit, ppb: r.ppb,
      qty: r.qty, rate: r.rate, discPct: r.discPct, gstPct: r.gstPct, cost: r.cost,
      gross: r.gross, disc: r.disc, taxable: r.taxable, tax: r.tax, total: r.total
    })),
    disc: { ...b.disc }, note: b.note || '', paidAtSale: paidNow, payMode: paidNow > 0 ? b.payMode : '',
    totals: { gross: t.gross, itemDiscount: t.itemDiscount, billDiscount: t.billDiscount, subtotal: t.subtotal, tax: t.tax, total: t.total, roundOff: t.roundOff, grand: t.grand, cost: t.cost, qty: t.qty, taxBreakup: t.taxBreakup },
    total: t.grand, tax: t.tax, taxBreakup: t.taxBreakup,
    createdBy: (S.session && S.session.email) || (DB.user && DB.user.email) || 'local',
    createdByName: sessionLabel() || 'Owner'
  };
  const isEdit = !!b._editing;
  await ACT.saveInvoice(inv, S, isEdit);
  const settings = { ...S.settings };
  const n = parseInt(String(inv.no).match(/(\d+)\s*$/)?.[1] || '0', 10);
  if (n >= num(settings.nextInvoiceNo)) { settings.nextInvoiceNo = n + 1; await ACT.saveSettings({ nextInvoiceNo: n + 1 }, S); }
  S.bill = blankBill();
  S.tab = 'invoices';
  render();
  showSavedPanel(inv);
};

ACTIONS['bill-clear'] = () => {
  S.bill = blankBill();
  render();
  UI.toast('Bill cleared');
};

/* ---- item search + adding lines ---- */
function addProductLine(p, qty) {
  const b = S.bill;
  const existing = b.lines.find((l) => l.productId === p.id && l.sellUnit !== 'box');
  if (existing) { existing.qty = round2(num(existing.qty) + num(qty)); render(); UI.toast(`${p.name}: now ${qtyFmt(existing.qty)} ${p.unit}`); return; }
  b.lines.push({
    productId: p.id, name: p.name, hsn: p.hsn || '', unit: p.unit || 'pcs', sellUnit: 'unit', ppb: num(p.ppb),
    qty: num(qty) || 1, rate: num(p.price), discPct: 0, gstPct: num(p.gst), cost: num(p.cost)
  });
  render();
}
function addCustomLine() {
  const name = prompt('Item name (not linked to stock):');
  if (!name) return;
  const rate = num(prompt('Rate (price per unit):', '0'));
  S.bill.lines.push({ productId: '', name: name.trim(), unit: 'pcs', sellUnit: 'unit', ppb: 0, qty: 1, rate, discPct: 0, gstPct: num(S.settings.defaultGst), cost: 0 });
  render();
}
ACTIONS['bill-custom-item'] = addCustomLine;
ACTIONS['prod-modal-from-bill'] = () => productModal(null, () => render());

ACTIONS['bill-search'] = (el) => {
  const q = el.value.trim().toLowerCase();
  const host = document.getElementById('bill-sugg');
  if (!host) return;
  if (!q) { host.innerHTML = ''; return; }
  const words = q.split(/\s+/);
  const hits = S.products.filter((p) => {
    const hay = (p.name + ' ' + (p.code || '') + ' ' + (p.brand || '') + ' ' + (p.category || '')).toLowerCase();
    return words.every((w) => hay.includes(w));
  }).sort((a, b) => num(b.stock) - num(a.stock)).slice(0, 8);
  host.innerHTML = hits.length ? hits.map((p) => `
      <div class="sugg-row" data-act="bill-add-item" data-id="${p.id}">
        <div><b>${esc(p.name)}</b><small>${p.code ? esc(p.code) + ' · ' : ''}${packDisplay(p.stock, p.ppb, p.unit)} in stock</small></div>
        <div class="right"><b>${money(p.price)}</b><small>per ${esc(p.unit)}${num(p.ppb) > 1 ? ` · box ${money(round2(num(p.price) * num(p.ppb)))}` : ''}</small></div>
      </div>`).join('')
    : `<div class="sugg-row none">No item matched "<b>${esc(el.value)}</b>". <button class="btn ghost sm" data-act="bill-custom-item" type="button">Add as custom item</button></div>`;
};
ACTIONS['bill-add-item'] = (el) => {
  const p = findProduct(el.dataset.id);
  if (!p) return;
  addProductLine(p, 1);
  const s = document.getElementById('bill-search');
  if (s) { s.value = ''; s.focus(); }
  const h = document.getElementById('bill-sugg');
  if (h) h.innerHTML = '';
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.id === 'bill-search') {
    const first = document.querySelector('#bill-sugg .sugg-row[data-act="bill-add-item"]');
    if (first) { e.preventDefault(); ACTIONS['bill-add-item'](first); }
  }
});

        <button class="btn ghost sm" data-act="export-invoices">${icon('download')} CSV</button>

    `)}

    ${list.length ? card('', `<div class="list bills">${list.map((i) => {
      const a = alloc.byInvoice[i.id] || { due: 0, status: 'paid' };

          <b>${money(i.total)}</b>

function printHTML(inner, title) {
  let host = document.getElementById('print-root');
  if (!host) {
    host = document.createElement('div');
    host.id = 'print-root';
    document.body.appendChild(host);
  }
  host.innerHTML = inner;
  const old = document.title;
  document.title = title || 'Print';
  UI.closeModal();
  setTimeout(() => {
    window.print();
    document.title = old;
    setTimeout(() => { host.innerHTML = ''; }, 800);
  }, 120);
}

function invoiceWAText(inv) {
  const s = S.settings;
  const cust = findCustomer(inv.customerId);
  const alloc = allocatePayments(S.invoices, S.payments).byInvoice[inv.id] || { due: 0 };
  const lines = (inv.lines || []).map((l, i) =>
    `${i + 1}. ${l.name} — ${qtyFmt(l.qty)} ${l.sellUnit === 'box' ? 'box' : l.unit} × ${money(l.rate, false)} = ${money(l.total, false)}`
  ).join('\n');
  const bal = cust ? customerBalance(cust, S.invoices, S.payments) : 0;
  return `*${s.shopName || 'Store'}*${s.phone ? ' · ' + s.phone : ''}
Bill: ${inv.no}   Date: ${fmtDate(inv.date)}
Customer: ${inv.customerName || 'Cash'}

${lines}

Total: ${money(inv.total)}
${num(inv.paidAtSale) ? `Paid: ${money(inv.paidAtSale)}\n` : ''}${alloc.due > 0 ? `*Pending on this bill: ${money(alloc.due)}*\n` : ''}${bal > 0 ? `*Total khata balance: ${money(bal)}*\n` : ''}${s.terms ? '\n' + s.terms : ''}`;
}

/**
 * Send any message to a customer on WhatsApp.
 * - desktop  → opens web.whatsapp.com in the logged-in WhatsApp Web tab
 * - phone    → opens the WhatsApp app
 * - no number saved → asks for it once, saves it to the customer, then opens the chat
 */
function sendWA(customerId, text, what, fallbackName) {
  const cust = customerId ? findCustomer(customerId) : null;
  if (cust && cust.phone) {
    const url = waOpen(cust.phone, text);
    UI.toast('Opening WhatsApp for ' + cust.name + (url.includes('web.whatsapp.com') ? ' (WhatsApp Web)' : ''));
    return;
  }
  if (!cust) {
    copyText(text).then((ok) => UI.toast(ok ? 'Cash bill — message copied, paste it in any chat' : 'Could not copy', ok ? 'ok' : 'warn', 5000));
    return;
  }
  waPhoneModal(cust, text, what);
}

function waPhoneModal(cust, text, what) {
  UI.openModal('WhatsApp number', `
    <p class="pad-top">No WhatsApp number saved for <b>${esc(cust.name)}</b>. Type it once — it is saved on the customer for next time.</p>
    <div class="form-grid">
      <label class="fld wide"><span>WhatsApp number</span>
        <input id="wa_phone" value="${esc(cust.phone || '')}" inputmode="tel" placeholder="10-digit mobile"></label>
    </div>
    <p class="note-line">Opens <b>${isMobileDevice() ? 'the WhatsApp app' : 'WhatsApp Web'}</b> with this message already typed in the chat —
      your WhatsApp stays logged in as it is, you only press Send.</p>
    <div class="modal-actions">
      <button class="btn primary" data-act="wa-phone-save" data-id="${cust.id}">${icon('wa')} Save & open WhatsApp</button>
      <button class="btn ghost" data-act="wa-copy-now" data-id="${cust.id}">Just copy the message</button>
      <button class="btn ghost" data-act="modal-close">Cancel</button>
    </div>`);
  S._waPending = { text, what };
}
ACTIONS['wa-phone-save'] = async (el) => {
  const cust = findCustomer(el.dataset.id);
  if (!cust) return;
  const phone = document.getElementById('wa_phone').value.trim();

  cust.phone = phone;
  await ACT.save('customers', cust, S, true);

VIEWS.khata = function () {
  const f = S.filters.khata;
  let list = S.customers.map((c) => {
    const bal = customerBalance(c, S.invoices, S.payments);
    const invs = S.invoices.filter((i) => i.customerId === c.id);
    const alloc = allocatePayments(invs, S.payments);
    const last = invs.slice().sort(sortByDate).slice(-1)[0];
    const oldestDue = Object.keys(alloc.byInvoice).filter((id) => alloc.byInvoice[id].due > 0.004)
      .map((id) => invs.find((i) => i.id === id)).sort(sortByDate)[0];
    return { c, bal, count: invs.length, last, oldestDueDays: oldestDue ? daysBetween(oldestDue.date, todayISO()) : null };
  });
  if (f.q) {
    const q = f.q.toLowerCase();
    list = list.filter((x) => (x.c.name + ' ' + (x.c.phone || '') + ' ' + (x.c.area || '')).toLowerCase().includes(q));
  }
  if (f.onlyDue) list = list.filter((x) => x.bal > 0.004 || x.bal < -0.004);
  list.sort((a, b) => b.bal - a.bal);

  const totalDue = round2(list.filter((x) => x.bal > 0).reduce((s, x) => s + x.bal, 0));
  const over30 = list.filter((x) => x.bal > 0.004 && x.oldestDueDays != null && x.oldestDueDays > 30);

  return `<div class="view">
    ${card('', `
      <div class="filters">
        <div class="search-wrap">${icon('search')}<input placeholder="Search customer name, phone, area…" value="${esc(f.q)}" data-input="flt-khata" data-f="q" data-search-focus></div>

        <span class="spacer"></span>
        <button class="btn" data-act="cust-modal">${icon('plus')} New customer</button>
        <button class="btn ghost" data-act="export-khata">${icon('download')} CSV</button>
      </div>
      <div class="stat-line"><span><b>${list.length}</b> customers</span><span>Total receivable <b class="warn-t">${money(totalDue)}</b></span>
        ${over30.length ? `<span><b class="bad-t">${over30.length}</b> overdue 30+ days</span>` : ''}</div>
    `)}

    ${list.length ? card('', `<div class="list">
      ${list.map(({ c, bal, count, last, oldestDueDays }) => `
        <div class="row" data-act="open-customer" data-id="${c.id}">
          <div class="avatar ${bal > 0 ? 'warn' : 'ok'}">${esc(c.name.slice(0, 1).toUpperCase())}</div>
          <div class="row-main">
            <b>${esc(c.name)} ${c.portal ? '<span class="pill ok" title="has app login">app login</span>' : ''}</b>
            <small>${esc(c.phone || 'no phone')} · ${count} bills${last ? ' · last ' + fmtDateShort(last.date) : ''}
            ${oldestDueDays != null && bal > 0 ? ` · oldest due ${oldestDueDays}d` : ''}</small>
          </div>
          <div class="row-right">
            <b class="${bal > 0 ? 'warn-t' : bal < 0 ? 'ok-t' : 'muted'}">${money(Math.abs(bal))}</b><!-- advances shown positive, labelled below -->
            <small>${bal > 0 ? 'to receive' : bal < 0 ? 'advance' : 'settled'}</small>
          </div>
          <div class="row-actions">
            <button class="icon-btn" data-act="pay-modal" data-cust="${c.id}" title="Take payment">${icon('cash')}</button>
            ${bal > 0 ? `<button class="icon-btn" data-act="wa-reminder" data-id="${c.id}" title="Send reminder">${icon('wa')}</button>` : ''}
          </div>
        </div>`).join('')}
    </div>`) : card('', emptyState('No customers yet.', 'Add customer', 'cust-modal', 'user'))}
  </div>`;
};

${S.settings.phone ? 'Ph: ' + S.settings.phone : ''}`;

Khata statement — ${c.name}${led.rows.length > 20 ? `\n(latest 20 of ${led.rows.length} entries)` : ''}

${rows.join('\n')}

Total billed: ${money(led.debit)}
Total paid: ${money(led.credit)}
*Closing balance: ${money(led.balance)}*${led.balance > 0 ? ' (to be received)' : led.balance < 0 ? ' (advance with you)' : ''}

Thank you for your business 🙏`;
}

        <tr><td>${fmtDateShort(m.date)}</td><td>${esc(m.productName)}${m.note ? `<small>${esc(m.note)}</small>` : ''}</td>

        <td>${esc(typeLabel(m.type))}</td><td>${esc(m.refLabel || '')}</td></tr>`).join('')}

function todayStockStrip(moves) {
  if (!moves.length) return '';
  const inQ = round2(moves.filter((m) => num(m.qty) > 0).reduce((s, m) => s + num(m.qty), 0));
  const outQ = round2(moves.filter((m) => num(m.qty) < 0).reduce((s, m) => s + num(m.qty), 0));
  return card('Today', `<div class="mini-stats">
      <div><small>Received</small><b class="ok-t">+${qtyFmt(inQ)}</b></div>
      <div><small>Sold / used</small><b class="bad-t">${qtyFmt(outQ)}</b></div>
      <div><small>Movements</small><b>${moves.length}</b></div>
    </div>`);
}

ACTIONS['prod-save'] = async (el) => {
  if (!requirePerm('stock', 'change the item list')) return;
  const id = el.dataset.id || '';
  const name = document.getElementById('p_name').value.trim();
  if (!name) return UI.toast('Item name is required', 'warn');
  const existing = id ? findProduct(id) : null;
  const obj = {
    id: existing ? existing.id : uid('prod'),
    name, code: document.getElementById('p_code').value.trim(),
    brand: document.getElementById('p_brand').value.trim(),
    category: document.getElementById('p_cat').value.trim(),
    hsn: document.getElementById('p_hsn').value.trim(),
    unit: document.getElementById('p_unit').value,
    ppb: num(document.getElementById('p_ppb').value) || 1,
    price: num(document.getElementById('p_price').value),
    cost: num(document.getElementById('p_cost').value),
    gst: num(document.getElementById('p_gst').value),
    lowStock: num(document.getElementById('p_low').value),
    stock: existing ? num(existing.stock) : num(document.getElementById('p_stock').value),
    createdAt: existing ? existing.createdAt : new Date().toISOString()
  };
  await ACT.save('products', obj, S, true);
  if (!existing && num(obj.stock) !== 0) {
    await ACT.save('moves', {
      id: uid('mv'), date: todayISO(), productId: obj.id, productName: obj.name, qty: num(obj.stock),
      type: 'purchase', refLabel: 'Opening stock', unit: obj.unit, note: 'Opening stock while creating item',
      value: round2(num(obj.stock) * num(obj.cost)), createdAt: new Date().toISOString()
    }, S, true);
  }
  UI.toast(existing ? 'Item updated' : 'Item added');
  UI.closeModal();
  render();
};

  if (!confirm(`Delete item "${p.name}"?\n\nPast bills keep their record. Stock of ${packDisplay(p.stock, p.ppb, p.unit)} will be removed from your stock list.`)) return;

/* ------------------------- stock in ------------------------- */
function stockInModal(preset = {}) {
  const p = preset.productId ? findProduct(preset.productId) : null;
  const unit = p ? p.unit : 'pcs';
  const ppb = p ? num(p.ppb) : 1;
  UI.openModal('Stock in (purchase)', `
    <div class="form-grid">
      <label class="fld wide"><span>Item *</span><select id="si_prod">${productOptions(preset.productId || '')}</select></label>
      <label class="fld"><span>Quantity received *</span><input id="si_qty" type="number" step="any" min="0" placeholder="0"></label>
      <label class="fld"><span>Received as</span>
        <select id="si_unit"><option value="unit">${esc(unit)}</option>${ppb > 1 ? '<option value="box">box</option>' : ''}</select></label>
      ${can('cost') ? `<label class="fld"><span>Cost / unit ${CUR}</span><input id="si_cost" type="number" step="any" min="0" value="${p ? num(p.cost) || '' : ''}"></label>` : ''}
      <label class="fld"><span>Date</span><input id="si_date" type="date" value="${preset.date || todayISO()}"></label>
      <label class="fld wide"><span>Supplier / bill reference</span><input id="si_sup" placeholder="e.g. Sharma Traders, bill 221"></label>
      <label class="fld wide"><span>Note</span><input id="si_note" placeholder="optional"></label>
    </div>
    <p class="note-line">Need a new item? <button class="btn ghost sm" data-act="prod-modal" type="button">Create item first</button></p>
    <div class="modal-actions">
      <button class="btn primary" data-act="stock-in-save" data-id="${preset.productId || ''}">${icon('check')} Add to stock</button>
      <button class="btn ghost" data-act="modal-close">Cancel</button>
    </div>`);
  const sel = document.getElementById('si_prod');
  if (sel) sel.onchange = () => {
    const pp = findProduct(sel.value);
    const uSel = document.getElementById('si_unit');
    const cIn = document.getElementById('si_cost');
    if (pp && cIn) {
      uSel.innerHTML = `<option value="unit">${esc(pp.unit)}</option>${num(pp.ppb) > 1 ? '<option value="box">box</option>' : ''}`;
      cIn.value = num(pp.cost) || '';
    }
  };
  const uSel = document.getElementById('si_unit');
  if (uSel) uSel.onchange = () => {
    const pp = findProduct(sel.value);
    const cIn = document.getElementById('si_cost');
    if (!cIn) return;
    if (pp && uSel.value === 'box') cIn.value = round2(num(pp.cost) * num(pp.ppb));
    else if (pp) cIn.value = num(pp.cost) || '';
  };
}

  stockInModal({ productId: (el.dataset && el.dataset.id) || '' });
};
ACTIONS['stock-in-save'] = async () => {
  if (!requirePerm('stock', 'add stock')) return;
  const siProd = document.getElementById('si_prod');
  if (!siProd) return;                          // the form is no longer on screen
  const productId = siProd.value;
  if (!productId) return UI.toast('Choose an item', 'warn');
  const qty = num(document.getElementById('si_qty').value);
  if (qty <= 0) return UI.toast('Enter quantity received', 'warn');
  const sellUnit = document.getElementById('si_unit').value;
  const p = findProduct(productId);
  const costEl = document.getElementById('si_cost');
  const costTyped = costEl ? num(costEl.value) : num(p.cost);   // no cost field → keep the item's own cost
  const costPerBase = sellUnit === 'box' && num(p.ppb) > 1 ? round2(costTyped / num(p.ppb)) : costTyped;
  await ACT.stockIn({
    productId, qty, sellUnit, cost: costPerBase, date: document.getElementById('si_date').value,
    supplier: document.getElementById('si_sup').value.trim(),
    note: document.getElementById('si_note').value.trim(), type: 'purchase'
  }, S);

  render();
};

ACTIONS['backup-json'] = () => {

  const data = {
    exportedAt: new Date().toISOString(), app: 'wholesale-billing', version: 1,
    settings: S.settings, products: S.products, customers: S.customers,
    invoices: S.invoices, payments: S.payments, moves: S.moves

ACTIONS['restore-json'] = () => {
  if (!requirePerm('data', 'use backup / data tools')) return;
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file) return;
    const text = await file.text();
    let d;
    try { d = JSON.parse(text); } catch (e) { return UI.toast('That file is not valid JSON', 'warn'); }
    if (!d || !d.products) return UI.toast('This backup file looks wrong', 'warn');
    if (!confirm(`Restore backup from ${d.exportedAt ? new Date(d.exportedAt).toLocaleString() : 'file'}?\n\nItems: ${(d.products || []).length}\nCustomers: ${(d.customers || []).length}\nBills: ${(d.invoices || []).length}\n\nThis MERGES with your current data (same IDs are overwritten).`)) return;
    UI.toast('Restoring…', 'ok', 1500);
    const jobs = [];
    if (d.settings) jobs.push(ACT.saveSettings({ ...d.settings }, S));
    ['products', 'customers', 'invoices', 'payments', 'moves'].forEach((c) => {
      (d[c] || []).forEach((obj) => jobs.push(ACT.save(c, obj, S, true)));
    });
    await Promise.all(jobs);
    UI.toast('Backup restored ✓');
    render();
  };
  input.click();
};

/* =========================================================================
   CUSTOMER PORTAL — what a customer sees after logging in with the
   ID + password the shop created for them.
   Read-only: their own balance, bills, payment history and statements.
   Reached at  <your-site>/#customer
   ========================================================================= */

const PORTAL = {
  mode() { return PORTAL_VIEWS.checking ? 'checking' : (S.portalUser ? 'in' : 'login'); },
  error: '',
  busy: false
};

/* ------------------------------------------------------------------ */
/*  Shell                                                              */
/* ------------------------------------------------------------------ */
function renderPortal() {
  const app = document.getElementById('app');
  if (!app) return;
  if (S.portalMode !== true) return;                  // never render the portal into the shop app
  if (!S.ready && !S.portalUser) {                    // still loading

ACTIONS['portal-login'] = async () => {
  const id = document.getElementById('pf_id').value.trim();
  const pw = document.getElementById('pf_pw').value;
  if (!id || !pw) { PORTAL.error = 'Enter your login ID and password.'; renderPortal(); return; }
  PORTAL.lastId = id;                       // keep it typed in if the password is wrong
  PORTAL.busy = true; PORTAL.error = '';
  renderPortal();
  try {
    const user = await PORTAL_DB.signIn(id, pw);
    S.portalUser = user;
    S.portalLoading = true;
    renderPortal();
    portalLoadData(() => renderPortal());
  } catch (e) {
    PORTAL.busy = false;
    PORTAL.error = e.message || 'Could not sign you in.';
    S.portalUser = null;
    renderPortal();
  }
};
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && document.getElementById('pf_pw') === document.activeElement && S.portalMode) ACTIONS['portal-login']();
});

ACTIONS['portal-logout'] = async () => {
  try { await PORTAL_DB.signOut(); } catch (e) { }
  S.portalUser = null;
  S.portalData = null;
  PORTAL.error = '';
  PORTAL.busy = false;
  try { sessionStorage.removeItem('wb_portal'); } catch (e) { }
  // stay on the portal route — never drop a customer into the shop screen
  if (String(location.hash || '').toLowerCase().indexOf('customer') < 0) location.hash = 'customer';
  UI.closeModal();
  renderPortal();
  location.reload();
};

/* ------------------------------------------------------------------ */
/*  Load the customer's own data                                       */
/* ------------------------------------------------------------------ */
function portalApplyData(d) {
  if (d.error === 'not-signed-in') { S.portalUser = null; PORTAL.busy = false; renderPortal(); return; }
  if (d.error === 'no-customer') {
    PORTAL.error = 'This login is not linked to a customer yet. Please ask the shop to create your login again.';
    S.portalUser = null; S.portalLoading = false; renderPortal(); return;
  }
  if (d.error === 'rules') {
    PORTAL.error = 'The shop needs to publish the updated security rules (firestore.rules) before logins work.';
    S.portalUser = null; S.portalLoading = false; renderPortal(); return;
  }
  S.portalData = d;
  S.portalLoading = false;
  // make the portal look like a shop with exactly one customer, so all existing
  // helpers (ledger, allocation, printing) work untouched
  S.settings = { ...DEFAULT_SETTINGS, ...(d.shop || {}), ...(S.portalShopCache || {}) };
  S.customers = [d.customer];
  S.invoices = d.invoices || [];
  S.payments = d.payments || [];
  S.moves = [];
  S.ready = true;
  renderPortal();
}
function portalLoadData(redraw) {
  PORTAL_DB.load((d) => { portalApplyData(d); if (redraw) redraw(); });
}

  if (!requirePerm('portal', 'manage customer logins')) return;
  const c = findCustomer(el.dataset.id);

  if (String(pw).length < 6) return UI.toast('Password must be at least 6 characters', 'warn', 5000);
  const taken = S.customers.find((x) => x.portal && String(x.portal.username || '').toLowerCase() === id.toLowerCase() && x.id !== c.id);
  if (taken) return UI.toast('That login ID is already used by ' + taken.name, 'warn', 5000);

/* ===== 57-staff.js ===== */
/* =========================================================================
   STAFF & PERMISSIONS
   - Role presets the owner can pick (Manager / Cashier / Counter+Stock / Store keeper)
   - Per-permission checkboxes for anything custom
   - Firebase mode: each staff member gets a real Firebase login (their own email +
     password). firestore.rules enforces what they may read/write.
   - Local mode: owner password + staff PIN/password on this device (the browser
     checks it — good for a shared counter PC, not internet-grade security)
   ========================================================================= */

/* ------------------------------------------------------------------ */
/*  Permission model                                                  */
/* ------------------------------------------------------------------ */
const PERMS = [
  { id: 'bill', label: 'Make bills (New Bill, Bills list, reprint)', group: 'Work' },
  { id: 'payment', label: 'Take payments (record khata payments, receipts)', group: 'Work' },
  { id: 'khata', label: 'See customers & khata balances, send reminders', group: 'Work' },
  { id: 'stock', label: 'Stock in, adjust stock, stock log, add items', group: 'Stock' },
  { id: 'reports', label: 'See reports & sales figures', group: 'Money' },
  { id: 'cost', label: 'See purchase cost, profit and stock value', group: 'Money' },
  { id: 'deleteBill', label: 'Edit or delete bills (changes stock back)', group: 'Risky' },
  { id: 'deletePayment', label: 'Delete a payment entry', group: 'Risky' },
  { id: 'settings', label: 'Change shop settings (GST, invoice numbers, backup)', group: 'Admin' },
  { id: 'data', label: 'Backup, restore, delete all data', group: 'Admin' },
  { id: 'staff', label: 'Add / remove staff logins', group: 'Admin' },
  { id: 'portal', label: 'Create customer logins (customer portal)', group: 'Admin' }
];
const ALL_PERMS = PERMS.map((p) => p.id);

const ROLES = [
  { id: 'owner', label: 'Owner (me)', desc: 'Everything, including settings and staff.', perms: ALL_PERMS },
  {
    id: 'manager', label: 'Manager', desc: 'Runs the shop: billing, payments, stock, reports, cost & profit. No staff, no backup/wipe.',
    perms: ['bill', 'payment', 'khata', 'stock', 'reports', 'cost', 'deleteBill', 'deletePayment', 'settings', 'portal']
  },
  {
    id: 'counter', label: 'Counter + Stock', desc: 'Billing, payments, khata and stock work. No profit, no reports, no deleting.',
    perms: ['bill', 'payment', 'khata', 'stock']
  },
  {
    id: 'cashier', label: 'Cashier (billing only)', desc: 'Billing, payments and khata balances. No stock changes, no reports, no cost.',
    perms: ['bill', 'payment', 'khata']
  },
  {
    id: 'store', label: 'Store keeper', desc: 'Stock in, adjustments, item list and khata balances. Cannot bill or take money.',
    perms: ['stock', 'khata']
  },
  { id: 'custom', label: 'Custom…', desc: 'Tick exactly what this person may do.', perms: ['bill'] }
];
function roleById(id) { return ROLES.find((r) => r.id === id) || ROLES[ROLES.length - 1]; }
function permsForRole(roleId, custom) {
  const r = roleById(roleId);
  if (roleId === 'custom') return Object.assign({}, custom || {});
  const out = {};
  ALL_PERMS.forEach((p) => { out[p] = r.perms.includes(p); });
  return out;
}
function permLabels(perms) {
  const on = PERMS.filter((p) => perms && perms[p.id]).map((p) => p.label.replace(/ \(.*\)/, ''));
  return on.length ? on.join(' · ') : 'no access yet';
}

/* ------------------------------------------------------------------ */
/*  Current session: who is using the app and what may they do        */
/* ------------------------------------------------------------------ */
function can(perm) {
  if (!perm) return true;
  if (!S.session) return true;                       // before login / legacy local install
  if (S.session.role === 'owner' || S.session.isOwner) return true;
  return !!(S.session.perms && S.session.perms[perm]);
}
function isOwnerSession() { return !S.session || S.session.role === 'owner' || !!S.session.isOwner; }
function sessionLabel() {
  if (!S.session) return '';
  return S.session.name || S.session.email || 'User';
}

/** Which permission a screen needs. null = everyone signed in. */
const VIEW_PERMS = {
  dash: null, bill: 'bill', khata: 'khata', payments: 'payment', products: 'stock',
  reports: 'reports', invoices: 'bill', settings: 'settings', staff: 'staff'
};
function canOpenView(tab) {
  const need = VIEW_PERMS[tab];
  return !need || can(need);
}

/** Guard for actions: refuse (with a message) if the session may not do this. */
function requirePerm(perm, what) {
  if (can(perm)) return true;
  UI.toast('Only the owner has permission to ' + (what || perm) + ' on this login', 'warn', 6000);
  return false;
}

/* ------------------------------------------------------------------ */
/*  Signing staff in — local mode (single device)                     */
/* ------------------------------------------------------------------ */
const LOCAL_AUTH = {
  /* Owner credentials live in their own local key — never inside the shop settings,
     so they are never synced to Firebase and never overwritten by a settings save. */
  _read() { try { return JSON.parse(localStorage.getItem('wb_owner_auth') || 'null'); } catch (e) { return null; } },
  _write(v) { try { if (v) localStorage.setItem('wb_owner_auth', JSON.stringify(v)); else localStorage.removeItem('wb_owner_auth'); } catch (e) { } },
  ownerInfo() { return this._read(); },
  async ownerPasswordSet() { const a = this._read(); return !!(a && a.hash); },
  async setOwnerPassword(email, password) {
    const salt = newSalt();
    const hash = await hashPassword(password, salt);
    this._write({ email: String(email || '').trim().toLowerCase(), salt, hash, setAt: new Date().toISOString() });
    return true;
  },
  async clearOwnerPassword() { this._write(null); return true; },
  async login(id, password) {
    const data = DB._readLocal() || {};
    const s = data.settings || {};
    const who = String(id || '').trim().toLowerCase();
    const owner = this._read();
    if (owner && owner.hash) {
      const ownerEmail = String(owner.email || '').toLowerCase();
      if (who === ownerEmail || who === 'owner' || who === 'me') {
        if (await verifyPassword(password, owner.salt, owner.hash)) {
          return { role: 'owner', isOwner: true, name: s.ownerName || 'Owner', email: ownerEmail, uid: 'local-owner' };
        }
        throw { code: 'local/bad-password', message: 'Wrong password.' };
      }
    }
    const staff = (data.staff || []).find((x) =>
      String(x.email || '').toLowerCase() === who || String(x.login || '').toLowerCase() === who);
    if (!staff) throw { code: 'local/no-user', message: 'No login with that ID on this device.' };
    if (staff.active === false) throw { code: 'local/disabled', message: 'This login has been switched off by the owner.' };
    const ok = await verifyPassword(password, staff.pinSalt, staff.pinHash);
    if (!ok) throw { code: 'local/bad-password', message: 'Wrong password.' };
    return {
      role: staff.role, isOwner: false, name: staff.name, email: staff.email,
      uid: 'local-' + staff.id, staffId: staff.id, perms: permsForRole(staff.role, staff.customPerms)
    };
  }
};

/* ------------------------------------------------------------------ */
/*  Resolving the session after Firebase sign-in                      */
/* ------------------------------------------------------------------ */
/**
 * Firebase mode: the owner's uid lives in settings/main.ownerUids (claimed by the
 * first signed-in account, and editable in Settings → Staff). Everyone else must
 * have a staff record with their uid, flagged active.
 */
async function resolveFirebaseSession(user) {
  if (!user) return null;
  const f = DB._fb;
  if (!f) return { role: 'owner', isOwner: true, name: user.email, email: user.email, uid: user.uid };
  const { doc, getDoc, setDoc } = f.api;
  let settings = null;
  try {
    const snap = await getDoc(doc(f.db, 'settings', 'main'));
    settings = snap.exists() ? snap.data() : null;
  } catch (e) { console.warn('settings read failed', e); }

  const ownerUids = (settings && settings.ownerUids) || [];
  let claimed = false;
  if (!ownerUids.length) {
    // first-ever login claims ownership (the account had to be created in Firebase by the owner)
    try {
      await setDoc(doc(f.db, 'settings', 'main'), {
        ownerUids: [user.uid], ownerEmails: [user.email || ''], ownerUidsSetAt: new Date().toISOString()
      }, { merge: true });
      claimed = true;
    } catch (e) { console.warn('could not claim ownership', e); }
  }
  if (claimed || ownerUids.includes(user.uid)) {
    return { role: 'owner', isOwner: true, name: (settings && settings.ownerName) || user.email, email: user.email, uid: user.uid, claimed };
  }
  // staff?
  try {
    const snap = await getDoc(doc(f.db, 'staff', user.uid));
    if (snap.exists()) {
      const st = snap.data();
      if (st.active === false) throw { code: 'staff/disabled' };
      return {
        role: st.role || 'custom', isOwner: false, name: st.name || user.email, email: user.email,
        uid: user.uid, staffId: user.uid, perms: permsForRole(st.role, st.customPerms)
      };
    }
  } catch (e) {
    if (e && e.code === 'staff/disabled') throw e;
    console.warn('staff lookup failed', e);
  }
  throw { code: 'staff/not-enabled' };
}

/** Create a login for a staff member (Firebase mode) and store their permissions */
async function createStaffLogin({ name, email, password, role, customPerms, phone }) {
  if (DB.mode !== 'firebase') {
    // local mode: store a PIN/password hash on this device
    const salt = newSalt();
    const rec = {
      id: uid('staff'), name, email: String(email || '').toLowerCase(), phone: phone || '',
      role, customPerms: role === 'custom' ? customPerms : null, active: true,
      mode: 'local', pinSalt: salt, pinHash: await hashPassword(password, salt),
      createdAt: new Date().toISOString()
    };
    await ACT.save('staff', rec, S, true);
    return { local: true, record: rec };
  }
  const inst = await DB._secondaryApp('staff-admin-' + Date.now());
  try {
    const cred = await inst.api.createUserWithEmailAndPassword(inst.auth, email, password);
    const uidNew = cred.user.uid;
    await inst.api.signOut(inst.auth);
    const rec = {
      id: uidNew, uid: uidNew, name, email: String(email).toLowerCase(), phone: phone || '',
      role, customPerms: role === 'custom' ? customPerms : null, active: true,
      mode: 'firebase', createdBy: (DB.user && DB.user.email) || '', createdAt: new Date().toISOString()
    };
    await ACT.save('staff', rec, S, true);       // doc id = auth uid → the rules use it
    return { local: false, record: rec };
  } catch (e) {
    const map = {
      'auth/email-already-in-use': 'That email already has a login. If it is an old staff account, delete it in Firebase → Authentication first.',
      'auth/weak-password': 'Password must be at least 6 characters.',
      'auth/invalid-email': 'Enter a valid email for this staff member.'
    };
    throw { code: e.code, message: map[e.code] || e.message };
  } finally {
    try { await inst.api.deleteApp(inst.app); } catch (e) { }
  }
}

/* ------------------------------ boot ------------------------------ */
function applyData(d) {
  d = d || {};
  const s = { ...DEFAULT_SETTINGS, ...(d.settings || {}) };
  if (typeof s.paymentModes === 'string') s.paymentModes = s.paymentModes.split(',').map((x) => x.trim()).filter(Boolean);
  S.settings = s;
  S.products = d.products || [];
  S.customers = d.customers || [];
  S.invoices = d.invoices || [];
  S.payments = d.payments || [];
  S.moves = d.moves || [];
  S.staff = d.staff || [];
  S.ready = true;
  render();
}

let _bootstrapped = false;
function onSnapshotData(d) {
  d = d || {};
  const first = !S.ready;
  applyData(d);
  if (first && DB.mode === 'firebase') {
    const empty = !d.settingsExists && !(d.products || []).length && !(d.customers || []).length && !(d.invoices || []).length;
    if (empty && !_bootstrapped) { _bootstrapped = true; setTimeout(() => onboardingModal(), 400); }
  }
  // Local mode: onboard only when the device has never been set up. `seeded` is written by
  // onboarding itself, so a half-finished or placeholder store cannot skip the setup screen.
  if (first && DB.mode === 'local' && !(d.settings && d.settings.seeded) && !(d.products || []).length) {
    setTimeout(() => onboardingModal(), 400);
  }
}

function restoreDraft() {
  try {
    const d = JSON.parse(localStorage.getItem('wb_bill_draft') || 'null');
    if (d && d.lines && d.lines.length) {
      if (confirm(`You have an unfinished bill (${d.lines.length} items, ${d.no || ''}). Restore it?`)) {
        S.bill = { ...blankBill(), ...d };
        S.tab = 'bill';
        render();
      } else localStorage.removeItem('wb_bill_draft');
    }
  } catch (e) { }
}
function saveDraft() {
  try {
    if (S.bill && S.bill.lines && S.bill.lines.length) {
      const { _editing, ...rest } = S.bill;
      localStorage.setItem('wb_bill_draft', JSON.stringify({ ...rest, _editing }));
    } else localStorage.removeItem('wb_bill_draft');
  } catch (e) { }
}

window.addEventListener('beforeunload', saveDraft);
document.addEventListener('visibilitychange', () => { if (document.hidden) saveDraft(); });

/* ---------------------------------------------------------------------------
   Are we on the customer portal?  Reachable at  <site>/#customer
   --------------------------------------------------------------------------- */
function isPortalRoute() {
  const h = String(location.hash || '').toLowerCase();
  return /(^|[#/?&])(customer|portal)($|[=&#/?])/.test(h) || /#customer/.test(h);
}

async function bootPortal() {
  S.portalMode = true;
  document.title = 'Customer portal';
  splash('Opening customer portal…');
  await DB.initPortal();
  try {
    S.portalShopCache = (await DB.readShopInfo()) || null;
  } catch (e) { S.portalShopCache = null; }
  S.settings = { ...DEFAULT_SETTINGS, ...(S.portalShopCache || {}) };
  document.title = (S.settings.shopName || 'Shop') + ' — customer login';
  S.ready = true;
  let user = null;
  try { user = await PORTAL_DB.currentUser(); } catch (e) { user = null; }
  if (user) {
    S.portalUser = user;
    S.portalLoading = true;
    renderPortal();
    PORTAL_DB.load((d) => portalApplyData(d));
  } else {
    renderPortal();
  }
}

window.addEventListener('hashchange', () => location.reload());

(async function boot() {
  if (isPortalRoute()) { await bootPortal(); return; }
  splash('Starting up…');
  const res = await DB.init(onSnapshotData, async (user) => {
    if (!user) {
      S.session = null;
      S.authRequired = true;
      renderLogin();
      return;
    }
    if (S.session && S.session.uid === user.uid) return;    // already resolved
    try {
      UI.toast('Signing in…', 'ok', 1200);
      S.session = await resolveFirebaseSession(user);
      try { sessionStorage.setItem('wb_session', JSON.stringify({ uid: user.uid })); } catch (e) { }
      await afterSession();
    } catch (e) {
      if (e && e.code === 'staff/disabled') S.sessionMessage = 'This staff login has been switched off by the owner.';
      else if (e && e.code === 'staff/not-enabled') S.sessionMessage = 'This login is not enabled in the shop app yet. Ask the owner to add you in Staff.';
      else S.sessionMessage = 'Could not load your access: ' + ((e && (e.message || e.code)) || 'unknown error');
      try { await DB.logout(); } catch (e2) { }
      S.session = null;
      S.authRequired = true;
      renderLogin();
    }
  });
  if (res && res.error) S.bootError = 'Firebase config problem: ' + res.error;
  if (DB.mode === 'local') {
    await DB.loadAll(onSnapshotData);
    if (await LOCAL_AUTH.ownerPasswordSet()) {
      S.authRequired = true;               // owner set a password → everybody signs in (owner or staff)
      S.session = null;
      renderLogin();
    } else {
      S.session = { role: 'owner', isOwner: true, name: S.settings.ownerName || 'Owner', email: S.settings.ownerEmail || '', uid: 'local-owner' };
      S.ready = true;
      render();
      setTimeout(restoreDraft, 300);
      // NOTE: `seeded` is deliberately NOT set here. Onboarding sets it once the owner has
      // actually named the shop — otherwise a visit that never finished setup would look
      // "already set up" next time and the owner would land in an empty shop.
    }
  }
  // offline app shell
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    navigator.serviceWorker.register('./sw.js').catch(() => { });
  }
  document.title = S.settings.shopName || 'Wholesale Billing';
  if (DB.mode === 'firebase') DB.publishShopInfo(S.settings);
})();

</script>
</body>
</html>
