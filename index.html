<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wholesale Store Billing</title>
<meta name="theme-color" content="#115e59">
<meta name="description" content="Billing, khata (credit ledger) and stock management for a wholesale store.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f766e'/%3E%3Ctext x='32' y='45' font-size='38' font-family='Arial' font-weight='bold' fill='white' text-anchor='middle'%3E%E2%82%B9%3C/text%3E%3C/svg%3E">
<style>
/* ============================================================
   Wholesale Store Billing — styles
   ============================================================ */
:root{
  --bg:#f1f5f9; --card:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --brand:#0f766e; --brand-d:#115e59; --brand-l:#ccfbf1;
  --ok:#059669; --ok-l:#d1fae5; --warn:#d97706; --warn-l:#fef3c7;
  --bad:#dc2626; --bad-l:#fee2e2; --accent:#4f46e5; --accent-l:#e0e7ff;
  --r:14px; --sh:0 1px 2px rgba(15,23,42,.06), 0 4px 14px rgba(15,23,42,.05);
  --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-text-size-adjust:100%; padding-bottom:calc(72px + var(--safe-b));
}
h1,h2,h3,h4{margin:0;font-weight:650}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.ic{width:18px;height:18px;fill:currentColor;flex:0 0 auto}
.spacer{flex:1}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.center{text-align:center}
.ok-t{color:var(--ok)!important}.warn-t{color:var(--warn)!important}.bad-t{color:var(--bad)!important}
.pad{padding:14px 16px}

/* ---------------- header ---------------- */
.hdr{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;box-shadow:0 2px 10px rgba(15,23,42,.12)}
.hdr-in{display:flex;align-items:center;gap:12px;padding:10px 14px;max-width:1180px;margin:0 auto}
.hdr-left{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700;font-size:14px;letter-spacing:.5px}
.logo.big{width:56px;height:56px;font-size:24px;background:var(--brand-l);color:var(--brand-d);margin:0 auto 10px}
.shop-name{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.shop-sub{font-size:11.5px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.today{font-size:12px;opacity:.9;display:none}
@media(min-width:640px){.today{display:inline}}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:4px 9px;border-radius:999px;background:rgba(255,255,255,.18)}
.badge .ic{width:14px;height:14px}
.badge.live{background:#065f46}
.badge.local{background:#92400e}
.dot{width:7px;height:7px;border-radius:50%;background:#fde68a;display:inline-block;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.banner{background:#fef3c7;color:#78350f;font-size:12.5px;padding:7px 14px;display:flex;gap:8px;align-items:center;justify-content:center;cursor:pointer}
.banner .ic{width:15px;height:15px}

/* ---------------- nav ---------------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:45;display:flex;gap:2px;overflow-x:auto;
  background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + var(--safe-b));scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav-item{flex:1 0 auto;min-width:60px;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:none;border:0;padding:6px 8px;border-radius:10px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer}
.nav-item.active{color:var(--brand-d);background:var(--brand-l)}
.nav-item .ic{width:21px;height:21px}
@media(min-width:900px){
  body{padding-bottom:24px}
  .nav{position:sticky;top:58px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;padding:6px 10px;box-shadow:0 1px 6px rgba(15,23,42,.05)}
  .nav-item{flex:0 0 auto;min-width:92px;flex-direction:row;gap:7px;font-size:13px;padding:8px 12px}
  .nav-item .ic{width:18px;height:18px}
}

/* ---------------- layout ---------------- */
.view{max-width:1180px;margin:0 auto;padding:14px}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(2,1fr)}
@media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr)}}
.two-col{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.two-col{grid-template-columns:1fr 1fr}.bill-bottom{grid-template-columns:1.15fr 1fr;align-items:start}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);margin:12px 0;overflow:hidden}
.view > .card:first-child{margin-top:0}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line)}
.card-head h3{font-size:14.5px;flex:1}
.card-head h3:empty{display:none}
.foot-note{text-align:center;color:var(--muted);font-size:12px;padding:10px 0 24px}

/* ---------------- kpi ---------------- */
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh);cursor:pointer}
.kpi-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
.kpi-value{font-size:22px;font-weight:750;margin-top:3px;letter-spacing:-.5px}
.kpi-sub{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.accent{border-left:4px solid var(--accent)}
.kpi.ok{border-left:4px solid var(--ok)}
.kpi.warn{border-left:4px solid var(--warn)}
.kpi.bad{border-left:4px solid var(--bad)}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;padding:12px 15px}
.mini-stats.four{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.mini-stats.four{grid-template-columns:repeat(4,1fr)}}
.mini-stats div{background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.mini-stats small{display:block;color:var(--muted);font-size:11.5px}
.mini-stats b{font-size:16px}
.stat-line{display:flex;gap:16px;flex-wrap:wrap;padding:10px 15px;font-size:13px;color:var(--muted);border-top:1px dashed var(--line)}
.stat-line b{color:var(--ink)}

/* ---------------- quick actions ---------------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.quick-btn{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border-radius:var(--r);
  border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:650;cursor:pointer;box-shadow:var(--sh)}
.quick-btn .ic{width:22px;height:22px;color:var(--brand)}
.quick-btn:active{transform:scale(.98)}

/* ---------------- lists / rows ---------------- */
.list{display:flex;flex-direction:column}
.list.tight .row{padding:9px 15px}
.row{display:flex;align-items:center;gap:11px;padding:11px 15px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:hover{background:#f8fafc}
.row-main{flex:1;min-width:0}
.row-main b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-main small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-right{text-align:right;white-space:nowrap}
.row-right b{display:block;font-size:14px}
.row-right small{display:block;color:var(--muted);font-size:11.5px}
.row-actions{display:flex;gap:2px}
@media(max-width:560px){.hide-sm{display:none}}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;background:var(--brand);flex:0 0 auto}
.avatar.warn{background:var(--warn)}.avatar.ok{background:var(--ok)}
.pill{display:inline-block;font-size:10.5px;font-weight:750;padding:2px 7px;border-radius:999px;background:var(--line);color:var(--muted);vertical-align:middle;letter-spacing:.2px}
.pill.ok{background:var(--ok-l);color:#065f46}
.pill.warn{background:var(--warn-l);color:#92400e}
.pill.bad{background:var(--bad-l);color:#991b1b}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:34px 18px;color:var(--muted);text-align:center}
.empty .ic{width:34px;height:34px;opacity:.5}
.bars{display:flex;flex-direction:column;gap:8px;padding:12px 15px}
.bar-row{display:grid;grid-template-columns:58px 1fr 74px;grid-template-areas:"d t v" "d s s";gap:2px 9px;align-items:center;font-size:12px}
.bar-day{grid-area:d;color:var(--muted)}
.bar-track{grid-area:t;height:9px;background:#eef2f6;border-radius:99px;overflow:hidden}
.bar-fill{height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}
.bar-val{grid-area:v;text-align:right;font-weight:650}
.bar-sub{grid-area:s;color:var(--muted);font-size:11px}

/* ---------------- buttons ---------------- */
.btn{display:inline-flex;align-items:center;gap:7px;justify-content:center;border:1px solid var(--line);background:#fff;
  color:var(--ink);padding:9px 14px;border-radius:11px;font-weight:650;font-size:13.5px;cursor:pointer}
.btn:hover{background:#f8fafc}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.danger{background:#fff;border-color:var(--bad-l);color:var(--bad)}
.btn.danger:hover{background:var(--bad-l)}
.btn.ghost{background:#fff}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:9px}
.btn.big{padding:13px 18px;font-size:15px;width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn .ic{width:16px;height:16px}
.icon-btn{border:1px solid transparent;background:none;padding:7px;border-radius:9px;cursor:pointer;color:var(--muted)}
.icon-btn:hover{background:#f1f5f9;color:var(--ink)}
.icon-btn.danger:hover{background:var(--bad-l);color:var(--bad)}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.active,.chip:hover{background:var(--brand-l);border-color:var(--brand);color:var(--brand-d)}
.quick-amts{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 10px}

/* ---------------- forms ---------------- */
.form-grid{display:grid;grid-template-columns:1fr;gap:11px;padding:14px 15px}
@media(min-width:620px){.form-grid{grid-template-columns:1fr 1fr}.form-grid .wide{grid-column:1/-1}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld > span{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px}
.fld input,.fld select,.fld textarea{padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%}
.fld input:focus,.fld select:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.fld.sm > span{font-size:10.5px}
.fld.sm input,.fld.sm select{padding:7px 9px;font-size:13px}
.fld input[readonly]{background:#f1f5f9;color:var(--muted)}
.check{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:4px 0}
.check input{width:18px;height:18px;accent-color:var(--brand)}
.filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:13px 15px}
.filters .spacer{flex:1 1 40px}
.search-wrap{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:11px;padding:0 11px;background:#fff;min-width:220px;flex:1}
.search-wrap .ic{color:var(--muted);width:16px;height:16px}
.search-wrap input{border:0;outline:0;padding:10px 0;flex:1;background:none}
.note-line{font-size:12px;color:var(--muted);padding:0 15px 12px;margin:0}
.sec-title{font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:16px 0 6px}
.err{background:var(--bad-l);color:#991b1b;padding:9px 12px;border-radius:10px;font-size:13px;margin:6px 0}
.err.small{font-size:12px}

/* ---------------- billing ---------------- */
.bill-top{display:grid;gap:11px;grid-template-columns:1fr;padding:14px 15px}
@media(min-width:760px){.bill-top{grid-template-columns:1.4fr auto 1fr 1fr;align-items:end}}
.cust-strip{display:flex;align-items:center;gap:9px;padding:9px 15px;font-size:13.5px;background:#f8fafc;border-top:1px solid var(--line);flex-wrap:wrap}
.cust-strip.warn{background:var(--warn-l)}
.cust-strip.ok{background:var(--ok-l)}
.cust-strip .ic{width:16px;height:16px;color:var(--muted)}
.item-search{display:flex;gap:9px;align-items:center;padding:13px 15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.item-search .ic{color:var(--muted)}
.item-search input{flex:1;min-width:180px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fff}
.item-search input:focus{outline:2px solid var(--brand-l);border-color:var(--brand)}
.sugg{border-bottom:1px solid var(--line)}
.sugg-row{display:flex;justify-content:space-between;gap:10px;padding:10px 15px;cursor:pointer;border-bottom:1px dashed var(--line);align-items:center}
.sugg-row:hover{background:var(--brand-l)}
.sugg-row b{font-size:13.5px}
.sugg-row small{display:block;color:var(--muted);font-size:11.5px}
.sugg-row .right{text-align:right}
.sugg-row.none{color:var(--muted);cursor:default;font-size:13px;gap:8px}
.bill-lines{display:flex;flex-direction:column}
.bill-line{padding:11px 15px;border-bottom:1px solid var(--line)}
.bill-line:last-child{border-bottom:0}
.bl-name b{font-size:14px}
.bl-name small{display:block;color:var(--muted);font-size:11.5px}
.bl-fields{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:8px;align-items:end;margin-top:8px}
@media(min-width:560px){.bl-fields{grid-template-columns:repeat(6,1fr) auto}}
.bl-total{display:flex;flex-direction:column;gap:4px}
.bl-total > span{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase}
.bl-total b{font-size:15px}
.totals-card{padding-bottom:12px}
.tot-row{display:flex;justify-content:space-between;gap:12px;padding:7px 15px;font-size:13.5px}
.tot-row span{color:var(--muted)}
.tot-row.grand{border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:16px;margin:5px 0;padding:11px 15px}
.tot-row.grand b{font-size:20px;color:var(--brand-d)}
.tot-row.ok-t span{color:var(--ok)}.tot-row.warn-t span{color:var(--warn)}
.save-actions{display:flex;gap:9px;padding:8px 15px 0}
.save-actions .btn{flex:1}

/* ---------------- tables ---------------- */
.table-wrap{overflow-x:auto}
.mini-table{width:100%;border-collapse:collapse;font-size:13px}
.mini-table th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.mini-table td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.mini-table td small{display:block;color:var(--muted);font-size:11.5px}
.mini-table .r{text-align:right;white-space:nowrap}
.mini-table .b{font-weight:700}
.mini-table tr:last-child td{border-bottom:0}
.mini-table tfoot td{background:#f8fafc;border-top:2px solid var(--line);font-weight:650}
tr.lr.payment td{background:#f6fefb}
tr.lr.opening td{background:#fffbeb}

/* ---------------- modal ---------------- */
#modal-host{display:none}
#modal-host.open{display:block}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:60;backdrop-filter:blur(2px)}
.modal{position:fixed;z-index:61;left:0;right:0;bottom:0;max-height:92vh;overflow:auto;background:#fff;
  border-radius:18px 18px 0 0;box-shadow:0 -10px 40px rgba(15,23,42,.3);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}}
.modal-head{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.modal-head h3{flex:1;font-size:16px}
.modal-body{padding:0 0 18px}
.modal-actions{display:flex;gap:9px;flex-wrap:wrap;padding:12px 15px}
.modal-actions.left{justify-content:flex-start;padding:8px 15px}
.modal-actions.sticky-top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:1}
@media(min-width:760px){
  /* Centred with a negative margin, not translateX(-50%): the entry animation
     (@keyframes up) sets transform, which would cancel the centring while it plays
     and leave the dialog half off-screen for those 180ms. */
  .modal{left:50%;margin-left:-320px;bottom:auto;top:6vh;width:640px;border-radius:18px}
  .modal.wide{width:900px;margin-left:-450px}
}
.saved{text-align:center;padding:18px 15px}
.saved-big{font-size:32px;font-weight:750;color:var(--brand-d)}
.saved-actions{display:flex;flex-direction:column;gap:9px;margin-top:16px}
@media(min-width:600px){.saved-actions{flex-direction:row;justify-content:center;flex-wrap:wrap}}
.inv-head{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:13px 15px;background:#f8fafc;border-bottom:1px solid var(--line)}
@media(min-width:620px){.inv-head{grid-template-columns:repeat(4,1fr)}}
.inv-head small{display:block;color:var(--muted);font-size:11.5px}
.inv-tots{padding:8px 15px}
.inv-tots > div{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.inv-tots > div.grand{font-size:16px;font-weight:700;border-bottom:1px solid var(--line)}
.khata-head{padding:14px 15px 0}
.kh-bal{background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;border-radius:14px;padding:16px 18px;text-align:center}
.kh-bal.warn{background:linear-gradient(135deg,#b45309,#f59e0b)}
.kh-bal.ok{background:linear-gradient(135deg,#065f46,#059669)}
.kh-bal small{display:block;font-size:12px;opacity:.9}
.kh-bal b{font-size:29px;letter-spacing:-.5px}
.kh-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px 0}
@media(min-width:620px){.kh-meta{grid-template-columns:repeat(4,1fr)}}
.kh-meta small{display:block;color:var(--muted);font-size:11.5px}
.quick-btn,.row,.kpi{transition:background .12s}
.steps{padding-left:20px}
.steps li{margin:9px 0}
.code{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:10px;font-size:12px;overflow-x:auto;white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace}
.conn{display:flex;gap:12px;align-items:center;padding:14px 15px}
.conn .ic{width:26px;height:26px}
.conn.ok .ic{color:var(--ok)}.conn.warn .ic{color:var(--warn)}
.conn b{display:block}
.conn small{color:var(--muted);font-size:12px}

/* ---------------- toast ---------------- */
#toasts{position:fixed;left:0;right:0;bottom:calc(78px + var(--safe-b));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
@media(min-width:900px){#toasts{bottom:22px}}
.toast{display:flex;align-items:center;gap:9px;background:#0f172a;color:#fff;padding:10px 15px;border-radius:12px;font-size:13.5px;
  box-shadow:0 8px 24px rgba(15,23,42,.3);animation:up .16s;max-width:min(520px,92vw)}
.toast .ic{width:16px;height:16px}
.toast.ok .ic{color:#6ee7b7}.toast.warn{background:#78350f}

/* ---------------- splash / login ---------------- */
.splash{display:flex;flex-direction:column;align-items:center;gap:14px;padding:80px 20px;color:var(--muted)}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.login{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px 22px;box-shadow:var(--sh);width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:11px}
.login-card h1{font-size:19px}
.login-card .fld{text-align:left}
.login-foot{color:var(--muted);font-size:12px;margin-top:14px}

/* ============================================================

<!-- app scripts (concat order matters: core → db → ui → shell → views → boot) -->
<script>
/*! Wholesale Store Billing — bundled 2026-09-19
 *  Built from src/js/*.js by build.py. Edit the src files, then re-run build.py.
 */

/* ===== 00-core.js ===== */
/* =========================================================================
   Wholesale Store Billing — CORE (pure logic + helpers, no DOM access)
   Everything between the PURE-LOGIC markers is unit-tested in tests/logic.test.mjs
   ========================================================================= */

/* ======== PURE-LOGIC-START ======== */

const CUR = '₹';

function num(v) {
  const n = Number(v);
  return Number.isFinite(n) ? n : 0;
}
function round2(v) {
  return Math.round((num(v) + Number.EPSILON) * 100) / 100;
}
/** Round to nearest paisa then display with Indian grouping */
function money(v, withSymbol = true) {
  const n = round2(v);
  const s = Math.abs(n).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  return (n < 0 ? '-' : '') + (withSymbol ? CUR : '') + s;
}
function qtyFmt(v) {
  const n = num(v);
  return Number.isInteger(n) ? String(n) : String(round2(n));
}
function pct(v) {
  const n = num(v);
  return Number.isInteger(n) ? String(n) : String(round2(n));
}
function isoDate(d = new Date()) {
  const p = (x) => String(x).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
}
function todayISO() { return isoDate(new Date()); }
function addDaysISO(iso, days) {
  const d = new Date(iso + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return isoDate(d);
}
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return String(iso);
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${d.getDate()} ${M[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateShort(iso) {
  if (!iso) return '—';
  const d = new Date(String(iso).slice(0, 10) + 'T00:00:00');
  if (isNaN(d)) return String(iso);
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${d.getDate()} ${M[d.getMonth()]}`;
}
function daysBetween(aISO, bISO) {
  const a = new Date(aISO + 'T00:00:00'), b = new Date(bISO + 'T00:00:00');
  return Math.round((b - a) / 86400000);
}
function monthLabel(iso) {
  const d = new Date(String(iso).slice(0, 7) + '-01T00:00:00');
  const M = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  return `${M[d.getMonth()]} ${d.getFullYear()}`;
}
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function uid(prefix = 'id') {
  return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}
function sortByDate(a, b) {
  if (a.date === b.date) return String(a.createdAt || a.no || '').localeCompare(String(b.createdAt || b.no || ''));
  return a.date < b.date ? -1 : 1;
}

/* ---------- Line / invoice math ----------
   Line input: { qty, rate, discPct, gstPct }
   opts: { taxEnabled, priceIncludesTax, roundOff }
   rate = price per selling unit (pcs / box / kg ...) as typed by the shop.
*/
function computeLine(line, opts) {
  const qty = num(line.qty), rate = num(line.rate);
  const discPct = Math.min(100, Math.max(0, num(line.discPct)));
  const gstPct = opts.taxEnabled ? Math.max(0, num(line.gstPct)) : 0;
  const gross = round2(qty * rate);
  const disc = round2(gross * discPct / 100);
  const net = round2(gross - disc);
  let taxable, tax, total;
  if (opts.priceIncludesTax) {
    taxable = gstPct ? round2(net / (1 + gstPct / 100)) : net;
    tax = round2(net - taxable);
    total = net;
  } else {
    taxable = net;
    tax = round2(net * gstPct / 100);
    total = round2(net + tax);
  }
  return { qty, rate, discPct, gstPct, gross, disc, taxable, tax, total };
}

function computeInvoice(lines, disc, opts) {
  const rows = (lines || []).map((l) => {
    const r = computeLine(l, opts);
    r.name = l.name || '';
    r.hsn = l.hsn || '';
    r.unit = l.unit || 'pcs';
    r.productId = l.productId || '';
    r.cost = num(l.cost);
    r.sellUnit = l.sellUnit || l.unit || 'pcs';
    r.ppb = num(l.ppb);
    return r;
  });
  const grossSum = round2(rows.reduce((s, r) => s + r.total, 0));

  const type = disc && disc.type ? disc.type : 'none';
  const val = num(disc && disc.value);
  let billDisc = type === 'pct' ? round2(grossSum * Math.min(100, Math.max(0, val)) / 100)
    : type === 'amt' ? round2(Math.max(0, val)) : 0;
  billDisc = round2(Math.min(billDisc, grossSum));

  // distribute the bill discount proportionally across lines (runding-safe)
  let allocated = 0;
  rows.forEach((r, i) => {
    let share;
    if (!rows.length) share = 0;
    else if (i === rows.length - 1) share = round2(billDisc - allocated);
    else share = grossSum ? round2(billDisc * r.total / grossSum) : 0;
    allocated = round2(allocated + share);
    if (share > r.total) share = r.total;
    r.billDiscShare = share;
    const finalTotal = round2(r.total - share);
    if (opts.priceIncludesTax) {
      r.taxable = r.gstPct ? round2(finalTotal / (1 + r.gstPct / 100)) : finalTotal;
      r.tax = round2(finalTotal - r.taxable);
    } else {
      const factor = r.total ? finalTotal / r.total : 1;
      r.taxable = round2(r.taxable * factor);
      r.tax = round2(finalTotal - r.taxable);
    }
    r.total = finalTotal;
  });

  const totals = {
    gross: grossSum,
    itemDiscount: round2(rows.reduce((s, r) => s + r.disc, 0)),
    billDiscount: billDisc,
    subtotal: round2(rows.reduce((s, r) => s + r.taxable, 0)),
    tax: round2(rows.reduce((s, r) => s + r.tax, 0)),
    total: round2(rows.reduce((s, r) => s + r.total, 0)),
    qty: round2(rows.reduce((s, r) => s + r.qty, 0)),
  };
  totals.roundOff = 0;
  totals.grand = totals.total;
  if (opts.roundOff && rows.length) {
    totals.grand = Math.round(totals.total);
    totals.roundOff = round2(totals.grand - totals.total);
  }
  const byRate = {};
  rows.forEach((r) => {
    const k = String(r.gstPct);
    byRate[k] = byRate[k] || { rate: r.gstPct, taxable: 0, tax: 0 };
    byRate[k].taxable = round2(byRate[k].taxable + r.taxable);
    byRate[k].tax = round2(byRate[k].tax + r.tax);
  });
  totals.taxBreakup = Object.values(byRate).filter((x) => x.rate > 0).sort((a, b) => a.rate - b.rate);
  totals.cost = round2(rows.reduce((s, r) => s + num(r.cost) * num(r.qty), 0));
  return { rows, totals };
}

/* ---------- Khata / ledger ---------- */

/** Simple running-balance statement rows for one customer */
function buildLedger(customer, invoices, payments) {
  const rows = [];
  const opening = round2(num(customer && customer.openingBalance));
  if (opening) rows.push({ date: customer.openingDate || '2000-01-01', type: 'opening', label: 'Opening balance', debit: opening > 0 ? opening : 0, credit: opening < 0 ? -opening : 0 });
  (invoices || []).filter((i) => i.customerId === customer.id).sort(sortByDate).forEach((inv) => {
    rows.push({
      date: inv.date, type: 'invoice', refId: inv.id, label: 'Bill ' + inv.no,
      sub: num(inv.paidAtSale) > 0 ? `Paid at bill: ${money(inv.paidAtSale)}` : '',
      debit: round2(inv.total), credit: round2(num(inv.paidAtSale)),
    });
  });
  (payments || []).filter((p) => p.customerId === customer.id).sort(sortByDate).forEach((p) => {
    rows.push({
      date: p.date, type: 'payment', refId: p.id,
      label: 'Payment received' + (p.mode ? ' · ' + p.mode : ''),
      sub: p.note || '', credit: round2(num(p.amount)),
    });
  });
  rows.sort(sortByDate);
  let bal = 0;
  rows.forEach((r) => { bal = round2(bal + num(r.debit) - num(r.credit)); r.balance = bal; });
  const debit = round2(rows.reduce((s, r) => s + num(r.debit), 0));
  const credit = round2(rows.reduce((s, r) => s + num(r.credit), 0));
  return { rows, balance: round2(debit - credit), debit, credit };
}

/** Total receivable for a customer (fast path, no allocation) */
function customerBalance(customer, invoices, payments) {
  let bal = round2(num(customer && customer.openingBalance));
  (invoices || []).forEach((i) => { if (i.customerId === customer.id) bal = round2(bal + num(i.total) - num(i.paidAtSale)); });
  (payments || []).forEach((p) => { if (p.customerId === customer.id) bal = round2(bal - num(p.amount)); });
  return bal;
}

/**
 * Which bill is still pending? Distribute payments FIFO (oldest bill first),
 * honouring payments that were explicitly linked to a bill.
 * Returns { byInvoice: {id:{due,paid,status}}, totalDue, advance }
 */
function allocatePayments(invoices, payments) {
  const invs = (invoices || []).slice().sort(sortByDate);
  const due = new Map();
  invs.forEach((i) => due.set(i.id, round2(num(i.total) - num(i.paidAtSale))));
  const queue = [];
  (payments || []).slice().sort(sortByDate).forEach((p) => {
    let amt = round2(num(p.amount));
    if (amt <= 0) return;
    if (p.invoiceId && due.has(p.invoiceId)) {
      const d = due.get(p.invoiceId);
      const use = Math.min(d, amt);
      due.set(p.invoiceId, round2(d - use));
      amt = round2(amt - use);
      if (amt <= 0) return;
    }
    queue.push({ id: p.id, amount: amt });
  });
  let qi = 0;
  invs.forEach((inv) => {
    let d = due.get(inv.id);
    while (d > 0.004 && qi < queue.length) {
      const q = queue[qi];
      const use = Math.min(d, q.amount);
      d = round2(d - use);
      q.amount = round2(q.amount - use);
      due.set(inv.id, d);
      if (q.amount <= 0.004) qi++;
    }
  });
  const advance = round2(queue.slice(qi).reduce((s, q) => s + num(q.amount), 0));
  const byInvoice = {};
  let totalDue = 0;
  invs.forEach((inv) => {
    const d = round2(Math.max(0, due.get(inv.id)));
    const unbilled = round2(num(inv.total) - num(inv.paidAtSale)); // left open when the bill was made
    const paidLater = round2(unbilled - d);
    const paidTotal = round2(num(inv.paidAtSale) + paidLater);
    totalDue = round2(totalDue + d);
    byInvoice[inv.id] = {
      due: d, paid: paidLater, paidAtSale: num(inv.paidAtSale), paidTotal,
      status: d <= 0.004 ? 'paid' : (paidTotal <= 0.004 ? 'unpaid' : 'partial'),
      ageDays: daysBetween(inv.date, todayISO())
    };
  });
  return { byInvoice, totalDue, advance };
}

/** Aging buckets across all open bills */
function agingBuckets(invoices, payments) {
  const alloc = allocatePayments(invoices, payments);
  const b = { '0-15': 0, '16-30': 0, '31-60': 0, '60+': 0 };
  Object.keys(alloc.byInvoice).forEach((id) => {
    const a = alloc.byInvoice[id];
    if (a.due <= 0.004) return;
    const age = a.ageDays;
    if (age <= 15) b['0-15'] += a.due; else if (age <= 30) b['16-30'] += a.due; else if (age <= 60) b['31-60'] += a.due; else b['60+'] += a.due;
  });
  Object.keys(b).forEach((k) => { b[k] = round2(b[k]); });
  return b;
}

/* ---------- Stock ---------- */

function isLowStock(p) {
  const t = num(p.lowStock);
  return t > 0 && num(p.stock) <= t;
}
/** base-unit qty consumed by a bill line (box line -> qty * piecesPerBox) */
function baseQty(lineQty, sellUnit, baseUnit, ppb) {
  const q = num(lineQty);
  if (sellUnit && baseUnit && sellUnit === 'box' && num(ppb) > 0) return round2(q * num(ppb));
  return round2(q);
}
/** pretty stock string, e.g. "3 box + 5 pcs" when a box holds 12 */
function packDisplay(stock, ppb, unit) {
  const s = round2(stock);
  if (num(ppb) > 1 && unit !== 'kg' && unit !== 'ltr') {
    const boxes = Math.floor(s / num(ppb));
    const rest = round2(s - boxes * num(ppb));
    if (boxes > 0 && rest > 0) return `${boxes} box + ${qtyFmt(rest)} ${unit}`;
    if (boxes > 0) return `${boxes} box`;
    return `${qtyFmt(s)} ${unit}`;
  }
  return `${qtyFmt(s)} ${unit || ''}`.trim();
}
/** stock value at cost */
function stockValue(products) {
  return round2((products || []).reduce((s, p) => s + num(p.stock) * num(p.cost), 0));
}
/** weighted-average new cost after a purchase */
function avgCost(oldStock, oldCost, inQty, inCost) {
  const os = num(oldStock), oc = num(oldCost), iq = num(inQty), ic = num(inCost);
  const total = os + iq;
  if (total <= 0) return round2(ic);
  if (ic <= 0) return round2(oc);
  return round2(((os > 0 ? os * oc : 0) + iq * ic) / total);
}

/* ---------- Reports ---------- */

function inRange(iso, from, to) {
  if (!iso) return false;
  if (from && iso < from) return false;
  if (to && iso > to) return false;
  return true;
}
function reportRange(state, from, to) {
  const invs = state.invoices.filter((i) => inRange(i.date, from, to));
  const pays = state.payments.filter((p) => inRange(p.date, from, to));
  const moves = (state.moves || []).filter((m) => inRange(m.date, from, to));
  const sales = round2(invs.reduce((s, i) => s + num(i.totals ? i.totals.grand : i.total), 0));
  const tax = round2(invs.reduce((s, i) => s + num(i.totals ? i.totals.tax : i.tax), 0));
  const discount = round2(invs.reduce((s, i) => s + num(i.totals ? i.totals.billDiscount : 0) + num(i.totals ? i.totals.itemDiscount : 0), 0));
  const cost = round2(invs.reduce((s, i) => s + num(i.totals ? i.totals.cost : 0), 0));
  const paidAtSale = round2(invs.reduce((s, i) => s + num(i.paidAtSale), 0));
  const collected = round2(pays.reduce((s, p) => s + num(p.amount), 0));
  const byMode = {};
  pays.forEach((p) => { const m = p.mode || 'Cash'; byMode[m] = round2(num(byMode[m]) + num(p.amount)); });
  const creditGiven = round2(invs.reduce((s, i) => s + num(i.total) - num(i.paidAtSale), 0));
  const purchases = round2(moves.filter((m) => m.type === 'purchase').reduce((s, m) => s + num(m.value), 0));
  const productMap = {};
  invs.forEach((i) => (i.lines || []).forEach((l) => {
    const k = l.productId || l.name;
    productMap[k] = productMap[k] || { name: l.name, qty: 0, amount: 0, unit: l.unit || 'pcs', profit: 0 };
    productMap[k].qty = round2(productMap[k].qty + num(l.qty));
    productMap[k].amount = round2(productMap[k].amount + num(l.total));
    productMap[k].profit = round2(productMap[k].profit + num(l.total) - num(l.cost) * num(l.qty));
  }));
  const topProducts = Object.values(productMap).sort((a, b) => b.amount - a.amount);
  return {
    from, to, invoices: invs.sort(sortByDate).reverse(), payments: pays.sort(sortByDate).reverse(), moves,
    sales, tax, discount, cost, profit: round2(sales - tax - cost), collected, byMode,
    creditGiven, purchases, topProducts, billCount: invs.length,
    itemsSold: round2(invs.reduce((s, i) => s + (i.lines || []).reduce((x, l) => x + num(l.qty), 0), 0)),
  };
}

/* ---------- Customer portal ids ---------- */

/** Login id → the email Firebase Auth uses internally.
 *  "ramesh123"  -> "ramesh123@customers.wholesale-billing.app"
 *  "r@shop.com" -> "r@shop.com" (a real email the owner typed is used as it is) */
function portalEmail(idOrEmail, domain) {
  const v = String(idOrEmail == null ? '' : idOrEmail).trim().toLowerCase();
  if (!v) return '';
  if (v.includes('@')) return v;
  const d = String(domain || 'customers.wholesale-billing.app').trim().toLowerCase();
  return v.replace(/[^a-z0-9._-]/g, '') + '@' + d;
}
function portalIdLooksLikeEmail(v) { return String(v || '').includes('@'); }
/** Login id rules: 3–30 chars, letters/numbers/dot/underscore/dash */
function portalIdOk(v) {
  const u = String(v || '').trim();
  return portalIdLooksLikeEmail(u) ? /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u) : /^[a-zA-Z0-9][a-zA-Z0-9._-]{2,29}$/.test(u);
}
/** A readable temporary password the owner can read out over the phone */
function randomPassword(len) {
  const alphabet = 'abcdefghjkmnpqrstuvwxyz23456789';
  const n = Math.max(6, Math.min(20, len || 8));
  let out = '';
  try {
    const buf = new Uint8Array(n);
    (window.crypto || crypto).getRandomValues(buf);
    for (let i = 0; i < n; i++) out += alphabet[buf[i] % alphabet.length];
  } catch (e) {
    for (let i = 0; i < n; i++) out += alphabet[Math.floor(Math.random() * alphabet.length)];
  }
  return out;
}
/** Login link the shop sends to customers (works for any hosting path) */
function portalLink(base) {
  const b = base || (typeof location !== 'undefined' ? location.origin + location.pathname : '');
  return String(b).split('#')[0] + '#customer';
}

/** Amount in words, Indian system (Lakh / Crore) — used on printed bills */
function amountInWords(amount) {
  const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve',
    'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
  const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
  function two(n) { return n < 20 ? a[n] : (b[Math.floor(n / 10)] + (n % 10 ? ' ' + a[n % 10] : '')); }
  function three(n) { return (n >= 100 ? a[Math.floor(n / 100)] + ' Hundred' + (n % 100 ? ' ' + two(n % 100) : '') : two(n)); }
  let n = Math.floor(Math.abs(num(amount)));
  const paise = Math.round((Math.abs(num(amount)) - n) * 100);
  if (n === 0 && paise === 0) return 'Zero Rupees Only';
  const parts = [];
  const crore = Math.floor(n / 10000000); n %= 10000000;
  const lakh = Math.floor(n / 100000); n %= 100000;
  const thousand = Math.floor(n / 1000); n %= 1000;
  if (crore) parts.push(three(crore) + ' Crore');
  if (lakh) parts.push(three(lakh) + ' Lakh');
  if (thousand) parts.push(three(thousand) + ' Thousand');
  if (n) parts.push(three(n));
  let out = parts.join(' ').trim() + ' Rupees';
  if (paise) out += ' and ' + two(paise) + ' Paise';
  return out + ' Only';
}

/** Normalise an Indian/local phone number to international digits for WhatsApp.
 *  "98200 11111" / "09820011111" → "919820011111" (country code from Settings). */
function normPhone(phone, cc) {
  let p = String(phone == null ? '' : phone).replace(/\D/g, '');
  const country = String(cc == null ? '91' : cc).replace(/\D/g, '') || '91';
  if (!p) return '';
  if (p.startsWith('00')) p = p.slice(2);
  if (p.length === 10) return country + p;                      // plain 10-digit mobile
  if (p.startsWith('0') && p.length === 11) return country + p.slice(1); // 0 + 10 digits
  if (p.length < 10) return country + p.replace(/^0+/, '');     // short number
  return p;                                                    // already has a country code
}

/**
 * Build the WhatsApp URL.
 *  mode   = 'auto' | 'web' | 'app'
 *  mobile = is this a phone? (browser passes isMobileDevice())
 *  auto on a PC     → web.whatsapp.com : opens the chat in the WhatsApp Web tab that
 *                     is already logged in, with the message pre-typed.
 *  auto on a phone  → wa.me : opens the WhatsApp app with the message pre-typed.
 */
function waUrlFor(mode, phone, text, cc, mobile) {
  const p = normPhone(phone, cc);
  const t = encodeURIComponent(text == null ? '' : text);
  const m = !mode || mode === 'auto' ? (mobile ? 'app' : 'web') : mode;
  if (m === 'app') return p ? `https://wa.me/${p}?text=${t}` : `https://wa.me/?text=${t}`;
  return p ? `https://web.whatsapp.com/send?phone=${p}&text=${t}` : `https://web.whatsapp.com/`;
}

function csv(rows, headers) {
  const head = headers.map((h) => `"${String(h.label).replace(/"/g, '""')}"`).join(',');
  const body = rows.map((r) => headers.map((h) => {
    let v = typeof h.value === 'function' ? h.value(r) : r[h.value];
    if (v == null) v = '';
    return `"${String(v).replace(/"/g, '""')}"`;
  }).join(',')).join('\n');
  return head + '\n' + body;
}

/** Unique customer list helpers */
function dueCustomers(customers, invoices, payments) {
  return customers.map((c) => ({ customer: c, balance: customerBalance(c, invoices, payments) }))
    .filter((x) => Math.abs(x.balance) > 0.004)
    .sort((a, b) => b.balance - a.balance);
}

/* ======== PURE-LOGIC-END ======== */

/* ---------- non-pure helpers (DOM / browser only) ---------- */
function debounce(fn, ms = 250) {
  let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
}
function download(filename, text, mime = 'text/plain;charset=utf-8') {
  try {
    const blob = new Blob([text], { type: mime });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    return true;
  } catch (e) { return false; }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      return true;
    } catch (e2) { return false; }
  }
}
/* ---------- password hashing (local mode only; Firebase Auth handles the cloud) ---------- */
function newSalt() {
  try {
    const b = new Uint8Array(12);
    (window.crypto || crypto).getRandomValues(b);
    return [...b].map((x) => x.toString(16).padStart(2, '0')).join('');
  } catch (e) { return String(Date.now().toString(36) + Math.random().toString(36).slice(2, 8)); }
}
async function hashPassword(password, salt) {
  const data = String(salt) + '|' + String(password);
  try {
    if (typeof crypto !== 'undefined' && crypto.subtle) {
      const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(data));
      return 'sha256:' + [...new Uint8Array(digest)].map((b) => b.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) { }
  let h = 5381;                       // fallback for file:// (no WebCrypto in insecure contexts)
  for (let i = 0; i < data.length; i++) h = ((h << 5) + h + data.charCodeAt(i)) >>> 0;
  return 'djb2:' + h.toString(16);
}
async function verifyPassword(password, salt, hash) {
  return (await hashPassword(password, salt)) === hash;
}

/* ---------- WhatsApp opening (browser) ---------- */
function isMobileDevice() {
  // Trust an explicit "yes" from either modern client hints or the UA string:
  // headless/spoofed UAs and a few in-app browsers only set one of the two.
  try {
    if (navigator.userAgentData && navigator.userAgentData.mobile === true) return true;
  } catch (e) { }
  const ua = navigator.userAgent || '';
  return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(ua);
}
/** URL for this device using the shop's saved settings */
function waUrl(phone, text) {
  return waUrlFor(S.settings.waMode || 'auto', phone, text, S.settings.countryCode || '91', isMobileDevice());
}
/**
 * Open WhatsApp with the message pre-typed and return the URL used.
 *  - counter PC  → web.whatsapp.com in the tab that is already logged in
 *  - phone       → the WhatsApp app (wa.me)
 */
function waOpen(phone, text) {
  const url = waUrl(phone, text);
  let win = null;
  try { win = window.open(url, '_blank'); } catch (e) { win = null; }
  if (!win) { try { location.href = url; } catch (e) { } }   // popup blocked → same tab
  if (S.settings.waAutoCopy) copyText(text);
  return url;
}
function waLink(phone, text) {   // legacy helper (always app link)
  return waUrlFor('app', phone, text, S.settings.countryCode || '91', true);
}

/* ===== 10-db.js ===== */
/* =========================================================================
   DATA LAYER
   - If FIREBASE_CONFIG below is filled in  -> Firebase Auth + Firestore
   - If it is left blank                   -> Local mode (this browser only)
   The rest of the app only talks to the DB.* methods, so both modes behave
   exactly the same.
   ========================================================================= */

/* ---------------------------------------------------------------------------
   Firebase config
   Paste your keys into the clearly-marked block at the TOP OF index.html
   (window.FIREBASE_CONFIG). Anything set there wins over these defaults.
   With no keys, the app runs in Local mode: it still works, but data stays in
   this browser only.
   --------------------------------------------------------------------------- */
const FIREBASE_DEFAULTS = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};
const FIREBASE_CONFIG = Object.assign(
  {},
  FIREBASE_DEFAULTS,
  (typeof window !== 'undefined' && window.FIREBASE_CONFIG) || {}
);

const COLLECTIONS = ['products', 'customers', 'invoices', 'payments', 'moves', 'staff'];
const LS_KEY = 'wholesale_billing_v1';
const FB_SDK = 'https://www.gstatic.com/firebasejs/10.12.5';

const DB = {
  mode: 'local',           // 'local' | 'firebase'
  online: false,
  user: null,
  _fb: null,               // { app, auth, db, api }
  _unsubs: [],
  _localWrite: null,

  isConfigured() {
    return !!(FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) && !this.forceLocal();
  },
  /** `?local=1` (or localStorage wb_force_local=1) keeps everything on this device even
   *  when Firebase keys are filled in — handy for trying the app out, demos and tests. */
  forceLocal() {
    try {
      const q = new URLSearchParams(location.search);
      if (q.get('local') === '1' || q.get('mode') === 'local') return true;
      return localStorage.getItem('wb_force_local') === '1';
    } catch (e) { return false; }
  },

  /* ---------------- local helpers ---------------- */
  _readLocal() {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null') || null; } catch (e) { return null; }
  },
  _writeLocal(state) {
    try {
      localStorage.setItem(LS_KEY, JSON.stringify({
        settings: state.settings, products: state.products, customers: state.customers,
        invoices: state.invoices, payments: state.payments, moves: state.moves,
        staff: state.staff || [], savedAt: new Date().toISOString()
      }));
    } catch (e) { console.warn('local save failed', e); }
  },
  /** mirror every change locally so a network/outage never loses data */
  mirror(state) { try { this._writeLocal(state); } catch (e) { } },

  /* ---------------- init ---------------- */
  /** Load the Firebase SDK once and keep { app, auth, db, api } handy. */
  async _ensureFirebase() {
    if (this._fb) return this._fb;
    const appMod = await import(`${FB_SDK}/firebase-app.js`);
    const authMod = await import(`${FB_SDK}/firebase-auth.js`);
    const fsMod = await import(`${FB_SDK}/firebase-firestore.js`);
    const app = appMod.initializeApp(FIREBASE_CONFIG);
    const auth = authMod.getAuth(app);
    const db = fsMod.initializeFirestore(app, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
    this._fb = { app, auth, db, api: { ...authMod, ...fsMod }, apps: {} };
    return this._fb;
  },
  /** A *separate* Firebase app instance — its login is independent of the shop's,
   *  so a customer signing in never signs the owner out (and vice-versa). */
  async _secondaryApp(name) {
    const f = await this._ensureFirebase();
    const key = name || 'portal';
    if (f.apps[key]) return f.apps[key];
    const appMod = await import(`${FB_SDK}/firebase-app.js`);
    const authMod = await import(`${FB_SDK}/firebase-auth.js`);
    const fsMod = await import(`${FB_SDK}/firebase-firestore.js`);
    const app = appMod.initializeApp(FIREBASE_CONFIG, key);
    const auth = authMod.getAuth(app);
    const db = fsMod.initializeFirestore(app, { localCache: fsMod.persistentLocalCache({ tabManager: fsMod.persistentMultipleTabManager() }) });
    f.apps[key] = { app, auth, db, api: { ...authMod, ...fsMod } };
    return f.apps[key];
  },

  async init(onData, onAuth) {
    if (!this.isConfigured()) {
      this.mode = 'local';
      const data = this._readLocal();
      onData(data || null);
      return { mode: 'local' };
    }
    try {
      const f = await this._ensureFirebase();
      const authMod = f.api;
      this.mode = 'firebase';
      this.online = true;
      f.api.onAuthStateChanged(f.auth, (user) => {
        this.user = user;
        onAuth(user);
      });
      return { mode: 'firebase' };
    } catch (e) {
      console.error('Firebase init failed, falling back to local mode', e);
      this.mode = 'local';
      this.online = false;
      onData(this._readLocal());
      return { mode: 'local', error: e.message };
    }
  },

  /** Portal page: set Firebase up (if configured) without subscribing to shop data. */
  async initPortal() {
    if (!this.isConfigured()) { this.mode = 'local'; return { mode: 'local' }; }
    try {
      await this._ensureFirebase();
      this.mode = 'firebase';
      this.online = true;
      return { mode: 'firebase' };
    } catch (e) {
      this.mode = 'local';
      return { mode: 'local', error: e.message };
    }
  },

  /** Non-sensitive shop card the customer portal shows before login
   *  (kept in /portal_shop/main, readable without signing in). */
  async publishShopInfo(settings) {
    if (this.mode !== 'firebase') return false;
    try {
      const f = await this._ensureFirebase();
      const { doc, setDoc } = f.api;
      await setDoc(doc(f.db, 'portal_shop', 'main'), {
        shopName: settings.shopName || '', phone: settings.phone || '', address: settings.address || '',
        gstin: settings.gstin || '', terms: settings.terms || '', currency: settings.currency || '₹',
        portalEnabled: settings.portalEnabled !== false,
        updatedAt: new Date().toISOString()
      }, { merge: true });
      return true;
    } catch (e) { console.warn('publishShopInfo failed', e); return false; }
  },
  async readShopInfo() {
    if (this.mode !== 'firebase') {
      const d = this._readLocal() || {};
      return d.settings || null;
    }
    try {
      const f = await this._ensureFirebase();
      const snap = await f.api.getDoc(f.api.doc(f.db, 'portal_shop', 'main'));
      return snap.exists() ? snap.data() : null;
    } catch (e) { return null; }
  },

  async login(email, password) {
    const f = this._fb;
    if (!f) throw new Error('Firebase not configured');
    await f.api.signInWithEmailAndPassword(f.auth, email, password);
  },
  async logout() {
    if (this._fb) await this._fb.api.signOut(this._fb.auth);
  },
  async sendReset(email) {
    const f = this._fb;
    if (!f) return;
    await f.api.sendPasswordResetEmail(f.auth, email);
  },

  /* ---------------- reads ---------------- */
  /** Live-load all collections. cb({products,customers,invoices,payments,moves,settings}) */
  async loadAll(cb) {
    if (this.mode !== 'firebase') {
      const d = this._readLocal() || {};
      cb({
        settings: d.settings || null, products: d.products || [], customers: d.customers || [],
        invoices: d.invoices || [], payments: d.payments || [], moves: d.moves || [],
        staff: d.staff || [], settingsExists: !!d.settings
      });
      return;
    }
    const f = this._fb;
    const { collection, doc, onSnapshot, getDoc } = f.api;
    this._unsubs.forEach((u) => { try { u(); } catch (e) { } });
    this._unsubs = [];
    const bucket = { settings: null, settingsExists: false, products: [], customers: [], invoices: [], payments: [], moves: [], staff: [] };

    const snap = await getDoc(doc(f.db, 'settings', 'main'));
    if (snap.exists()) { bucket.settings = snap.data(); bucket.settingsExists = true; }
    cb({ ...bucket });

    COLLECTIONS.forEach((c) => {
      const un = onSnapshot(collection(f.db, c), (qs) => {
        bucket[c] = qs.docs.map((d) => ({ id: d.id, ...d.data() }));
        cb({ ...bucket });
      }, (err) => {
        console.error('snapshot error on ' + c, err);
        UI.toast('Sync problem: ' + err.code + ' — working from local copy', 'warn', 6000);
      });
      this._unsubs.push(un);
    });
    const unS = onSnapshot(doc(f.db, 'settings', 'main'), (d) => {
      bucket.settings = d.exists() ? d.data() : null;
      bucket.settingsExists = d.exists();
      cb({ ...bucket });
    }, (e) => { });
    this._unsubs.push(unS);
  },

  /* ---------------- writes ---------------- */
  async put(coll, obj) {
    const clean = JSON.parse(JSON.stringify(obj));
    if (this.mode !== 'firebase') return clean;
    const f = this._fb;
    const { doc, setDoc } = f.api;
    const { id, ...rest } = clean;
    await setDoc(doc(f.db, coll, id), rest, { merge: true });
    return clean;
  },
  async del(coll, id) {
    if (this.mode !== 'firebase') return true;
    const f = this._fb;
    const { doc, deleteDoc } = f.api;
    await deleteDoc(doc(f.db, coll, id));
    return true;
  },
  async putSettings(settings) {
    if (this.mode !== 'firebase') return settings;
    const f = this._fb;
    const { doc, setDoc } = f.api;
    const { _id, ...rest } = settings;
    await setDoc(doc(f.db, 'settings', 'main'), rest, { merge: true });
    return settings;
  },
  async wipeRemote() {
    if (this.mode !== 'firebase') return;
    const f = this._fb;
    const { collection, getDocs, deleteDoc, doc } = f.api;
    for (const c of COLLECTIONS) {
      const qs = await getDocs(collection(f.db, c));
      for (const d of qs.docs) await deleteDoc(doc(f.db, c, d.id));
    }
  }
};

/* ------------------------------------------------------------------ */
/*  CUSTOMER PORTAL — login + read-only data for one customer          */
/*  Firebase mode: real Firebase Auth accounts, locked down by rules    */
/*  (see firestore.rules). Local mode: checked on this device only.     */
/* ------------------------------------------------------------------ */
const PORTAL_DOMAIN = (typeof window !== 'undefined' && window.PORTAL_DOMAIN) || 'customers.wholesale-billing.app';

const PORTAL_DB = {
  /** Which mode the portal login should use */
  mode() { return DB.mode === 'firebase' ? 'firebase' : 'local'; },

  /* ---------------- sign in / out ---------------- */
  async signIn(userId, password) {
    const email = portalEmail(userId, PORTAL_DOMAIN);
    if (!email || !password) throw { code: 'portal/missing-fields' };
    if (DB.mode !== 'firebase') return this._localSignIn(userId, password);
    const inst = await DB._secondaryApp('portal');
    const { signInWithEmailAndPassword } = inst.api;
    try {
      const cred = await signInWithEmailAndPassword(inst.auth, email, password);
      return { uid: cred.user.uid, email: cred.user.email, local: false };
    } catch (e) {
      throw this._friendly(e);
    }
  },
  async signOut() {
    if (DB.mode !== 'firebase') { try { sessionStorage.removeItem('wb_portal'); } catch (e) { } return; }
    const inst = await DB._secondaryApp('portal');
    await inst.api.signOut(inst.auth);
  },
  /** Is a customer already signed in on this device? */
  async currentUser() {
    if (DB.mode !== 'firebase') {
      try {
        const id = JSON.parse(sessionStorage.getItem('wb_portal') || 'null');
        return id ? { local: true, customerId: id.customerId, username: id.username } : null;
      } catch (e) { return null; }
    }
    const inst = await DB._secondaryApp('portal');
    const u = inst.auth.currentUser;
    return u ? { uid: u.uid, email: u.email, local: false } : null;
  },

  _friendly(e) {
    const map = {
      'auth/invalid-credential': 'Wrong login ID or password.',
      'auth/wrong-password': 'Wrong password.',
      'auth/user-not-found': 'This login ID does not exist. Ask the shop to create it again.',
      'auth/invalid-email': 'That login ID is not valid.',
      'auth/too-many-requests': 'Too many attempts. Please wait a minute and try again.',
      'auth/network-request-failed': 'No internet connection. Try again once you are online.',
      'auth/user-disabled': 'This login has been switched off by the shop.',
      'auth/api-key-not-valid.-please-pass-a-valid-api-key.': 'Firebase key problem — tell the shop owner (Settings → Setup guide).'
    };
    return { code: e.code || 'portal/error', message: map[e.code] || (e.message || 'Could not sign in.') };
  },

  _localSignIn(userId, password) {
    const data = DB._readLocal() || {};
    const uname = String(userId || '').trim().toLowerCase();
    const cust = (data.customers || []).find((c) => c.portal && c.portal.active !== false &&
      (String(c.portal.username || '').toLowerCase() === uname ||
        String(c.portal.username || '').toLowerCase() === uname.replace(/\s+/g, '')));
    if (!cust) throw { code: 'portal/no-user', message: 'No customer login with that ID. Ask the shop to create it.' };
    return verifyPassword(password, cust.portal.salt, cust.portal.passHash).then((ok) => {
      if (!ok) throw { code: 'portal/bad-password', message: 'Wrong password. Please check with the shop.' };
      try { sessionStorage.setItem('wb_portal', JSON.stringify({ customerId: cust.id, username: cust.portal.username })); } catch (e) { }
      return { local: true, customerId: cust.id, username: cust.portal.username };
    });
  },

  /* ---------------- owner-side account management ---------------- */
  /** Create the Firebase Auth account for a customer login (keeps the owner signed in) */
  async createLogin(userId, password) {
    const email = portalEmail(userId, PORTAL_DOMAIN);
    if (DB.mode !== 'firebase') return { email, uid: '', local: true };
    const inst = await DB._secondaryApp('portal-admin-' + Date.now());
    const { createUserWithEmailAndPassword, signOut, deleteApp } = inst.api;
    try {
      const cred = await createUserWithEmailAndPassword(inst.auth, email, password);
      const uid = cred.user.uid;
      await signOut(inst.auth);
      return { email, uid, local: false };
    } catch (e) {
      const map = {
        'auth/email-already-in-use': 'This login ID is already taken — choose another (or the old account was left behind in Firebase → Authentication).',
        'auth/weak-password': 'Password must be at least 6 characters.',
        'auth/invalid-email': 'That login ID is not valid.'
      };
      throw { code: e.code, message: map[e.code] || e.message };
    } finally {
      try { await inst.api.deleteApp(inst.app); } catch (e) { }
    }
  },
  /** Change a customer's password (the owner knows the current one) */
  async changePassword(userId, currentPassword, newPassword) {
    const email = portalEmail(userId, PORTAL_DOMAIN);
    if (DB.mode !== 'firebase') return { local: true };
    const inst = await DB._secondaryApp('portal-admin-' + Date.now());
    try {
      await inst.api.signInWithEmailAndPassword(inst.auth, email, currentPassword);
      await inst.api.updatePassword(inst.auth.currentUser, newPassword);
      await inst.api.signOut(inst.auth);
      return { local: false };
    } catch (e) {
      const map = {
        'auth/invalid-credential': 'Current password is wrong. If it was changed and forgotten, remove the login and create it again.',
        'auth/wrong-password': 'Current password is wrong.',
        'auth/weak-password': 'New password must be at least 6 characters.'
      };
      throw { code: e.code, message: map[e.code] || e.message };
    } finally {
      try { await inst.api.deleteApp(inst.app); } catch (e) { }
    }
  },
  /** Remove a customer's login */
  async deleteLogin(userId, currentPassword) {
    const email = portalEmail(userId, PORTAL_DOMAIN);
    if (DB.mode !== 'firebase') return { local: true };
    const inst = await DB._secondaryApp('portal-admin-' + Date.now());
    try {
      await inst.api.signInWithEmailAndPassword(inst.auth, email, currentPassword);
      await inst.api.deleteUser(inst.auth.currentUser);
      await inst.api.signOut(inst.auth);
      return { local: false };
    } catch (e) {
      return { local: false, warning: 'Could not delete the login in Firebase (' + (e.code || e.message) + '). The customer record was cleared here — also remove the user in Firebase → Authentication for a full cleanup.' };
    } finally {
      try { await inst.api.deleteApp(inst.app); } catch (e) { }
    }
  },

  /* ---------------- reading one customer's data ---------------- */
  /**
   * Live-load everything this customer is allowed to see.
   * cb({ customer, invoices, payments, shop, error })
   */
  async load(cb) {
    if (DB.mode !== 'firebase') return this._loadLocal(cb);
    const inst = await DB._secondaryApp('portal');
    const { collection, doc, getDoc, getDocs, onSnapshot, query, where } = inst.api;
    const uid = inst.auth.currentUser ? inst.auth.currentUser.uid : '';
    if (!uid) return cb({ error: 'not-signed-in' });
    const shop = await this.readShop();
    // the customer doc the rules link to this auth account
    let customer = null;
    try {
      const qs = await getDocs(query(collection(inst.db, 'customers'), where('authUid', '==', uid)));
      if (!qs.empty) customer = { id: qs.docs[0].id, ...qs.docs[0].data() };
    } catch (e) {
      console.error(e);
      return cb({ error: 'rules', message: (e.code || e.message) });
    }
    if (!customer) return cb({ error: 'no-customer', shop });
    const bucket = { customer, invoices: [], payments: [], shop };
    const emit = () => cb({ ...bucket });
    onSnapshot(query(collection(inst.db, 'invoices'), where('customerId', '==', customer.id)),
      (qs) => { bucket.invoices = qs.docs.map((d) => ({ id: d.id, ...d.data() })); emit(); },
      (e) => console.error('portal invoices', e));
    onSnapshot(query(collection(inst.db, 'payments'), where('customerId', '==', customer.id)),
      (qs) => { bucket.payments = qs.docs.map((d) => ({ id: d.id, ...d.data() })); emit(); },
      (e) => console.error('portal payments', e));
    emit();
  },

  _loadLocal(cb) {
    const id = (() => { try { return JSON.parse(sessionStorage.getItem('wb_portal') || 'null'); } catch (e) { return null; } })();
    const data = DB._readLocal() || {};
    if (!id) return cb({ error: 'not-signed-in' });
    const customer = (data.customers || []).find((c) => c.id === id.customerId);
    if (!customer) return cb({ error: 'no-customer' });
    cb({
      customer,
      invoices: (data.invoices || []).filter((i) => i.customerId === customer.id),
      payments: (data.payments || []).filter((p) => p.customerId === customer.id),
      shop: data.settings || null
    });
  },

  async readShop() {
    try {
      const f = await DB._ensureFirebase();
      const snap = await f.api.getDoc(f.api.doc(f.db, 'portal_shop', 'main'));
      return snap.exists() ? snap.data() : null;
    } catch (e) { return null; }
  }
};

/* ------------------------------------------------------------------ */
/* Business actions — every write goes through here (mirror + persist)  */
/* ------------------------------------------------------------------ */
const ACT = {
  saving: 0,

  async save(coll, obj, state, quiet) {
    const isNew = !state[coll].some((x) => x.id === obj.id);
    obj.updatedAt = new Date().toISOString();
    if (isNew) obj.createdAt = obj.updatedAt;
    const i = state[coll].findIndex((x) => x.id === obj.id);
    if (i >= 0) state[coll][i] = obj; else state[coll].push(obj);
    DB.mirror(state);
    if (!quiet) UI.toast((isNew ? 'Saved ' : 'Updated ') + coll.slice(0, -1));
    try {
      this.saving++;
      await DB.put(coll, obj);
    } catch (e) {
      console.error(e);
      UI.toast('Could not save to cloud: ' + (e.code || e.message) + ' (saved on this device)', 'warn', 7000);
    } finally {
      this.saving--;
      UI.syncBadge();
    }
    return obj;
  },

  async remove(coll, id, state, quiet) {
    state[coll] = state[coll].filter((x) => x.id !== id);
    DB.mirror(state);
    if (!quiet) UI.toast('Deleted');
    try { await DB.del(coll, id); }
    catch (e) { UI.toast('Cloud delete failed: ' + (e.code || e.message), 'warn', 7000); }
    return true;
  },

  async saveSettings(patch, state) {
    state.settings = { ...state.settings, ...patch };
    DB.mirror(state);
    DB.publishShopInfo(state.settings);      // brand the customer portal (fire & forget)
    try { await DB.putSettings(state.settings); }
    catch (e) { UI.toast('Settings sync failed (kept locally)', 'warn', 6000); }
    return state.settings;
  },

  /** Create or update an invoice + adjust stock + write stock movements */
  async saveInvoice(inv, state, isEdit) {
    const prev = isEdit ? state.invoices.find((x) => x.id === inv.id) : null;
    const saved = await this.save('invoices', inv, state, true);

    // reverse stock of the previous version first (edit case)
    if (prev) await this._reverseStock(prev, state, 'Bill ' + prev.no + ' edited', inv.date);

    const moves = [];
    (inv.lines || []).forEach((l) => {
      if (!l.productId) return;
      const p = state.products.find((x) => x.id === l.productId);
      if (!p) return;
      const q = baseQty(l.qty, l.sellUnit, p.unit, p.ppb);
      const wasBox = l.sellUnit === 'box' && num(l.ppb) > 0;
      moves.push({
        id: uid('mv'), date: inv.date, productId: p.id, productName: p.name,
        qty: -q, type: 'sale', ref: inv.id, refLabel: 'Bill ' + inv.no,
        unit: p.unit, note: wasBox ? `${qtyFmt(l.qty)} box × ${qtyFmt(l.ppb)} = ${qtyFmt(q)} ${p.unit}` : '',
        value: -round2(num(l.cost) * q), createdAt: new Date().toISOString()
      });
      p.stock = round2(num(p.stock) - q);
    });
    for (const m of moves) await this.save('moves', m, state, true);
    for (const l of (inv.lines || [])) {
      if (!l.productId) continue;
      const p = state.products.find((x) => x.id === l.productId);
      if (p) await this.save('products', p, state, true);
    }
    UI.toast(prev ? 'Bill updated ✓' : 'Bill saved ✓');
    return saved;
  },

  async _reverseStock(inv, state, reason, date) {
    const moves = [];
    (inv.lines || []).forEach((l) => {
      if (!l.productId) return;
      const p = state.products.find((x) => x.id === l.productId);
      if (!p) return;
      const q = baseQty(l.qty, l.sellUnit, p.unit, p.ppb);
      moves.push({
        id: uid('mv'), date: date || inv.date, productId: p.id, productName: p.name,
        qty: q, type: 'reverse', ref: inv.id, refLabel: 'Bill ' + inv.no + ' cancelled / edited',
        unit: p.unit, note: reason, value: round2(num(l.cost) * q), createdAt: new Date().toISOString()
      });
      p.stock = round2(num(p.stock) + q);
    });
    for (const m of moves) await this.save('moves', m, state, true);
    for (const l of (inv.lines || [])) {
      if (!l.productId) continue;
      const p = state.products.find((x) => x.id === l.productId);
      if (p) await this.save('products', p, state, true);
    }
  },

  async deleteInvoice(inv, state) {
    await this._reverseStock(inv, state, 'Bill ' + inv.no + ' deleted', inv.date);
    await this.remove('invoices', inv.id, state, true);
    UI.toast('Bill deleted, stock returned ✓');
  },

  /** Stock IN / adjustment */
  async stockIn(patch, state) {
    const p = state.products.find((x) => x.id === patch.productId);
    if (!p) throw new Error('Product not found');
    const q = baseQty(patch.qty, patch.sellUnit, p.unit, p.ppb);
    const oldStock = num(p.stock);
    p.stock = round2(oldStock + q);
    if (patch.type === 'purchase' && num(patch.cost) > 0) p.cost = avgCost(oldStock, p.cost, q, patch.cost);
    if (patch.newPrice) p.price = round2(patch.newPrice);
    const mv = {
      id: uid('mv'), date: patch.date || todayISO(), productId: p.id, productName: p.name,
      qty: q, type: patch.type || 'purchase', ref: uid('in'), refLabel: patch.supplier || 'Stock in',
      unit: p.unit, note: patch.note || '', value: round2(num(patch.cost || p.cost) * q), createdAt: new Date().toISOString()
    };
    await this.save('products', p, state, true);
    await this.save('moves', mv, state, true);
    UI.toast(`Stock updated: ${p.name} +${qtyFmt(q)} ${p.unit}`);
    return p;
  },

  /** Set counted stock (physical count / damage) */
  async stockAdjust(productId, countedQty, note, state, date) {
    const p = state.products.find((x) => x.id === productId);
    if (!p) throw new Error('Product not found');
    const delta = round2(num(countedQty) - num(p.stock));
    p.stock = round2(num(countedQty));
    await this.save('products', p, state, true);
    await this.save('moves', {
      id: uid('mv'), date: date || todayISO(), productId: p.id, productName: p.name, qty: delta,
      type: 'adjust', refLabel: 'Stock adjustment', unit: p.unit, note: note || 'Physical count',
      value: round2(delta * num(p.cost)), createdAt: new Date().toISOString()
    }, state, true);
    UI.toast(`Adjusted ${p.name} by ${delta >= 0 ? '+' : ''}${qtyFmt(delta)} ${p.unit}`);
  },

  /** Rebuild every product's stock from the movement history (repair tool) */
  async recalcStock(state) {
    let fixed = 0;
    for (const p of state.products) {
      const total = round2((state.moves || []).filter((m) => m.productId === p.id).reduce((s, m) => s + num(m.qty), 0));
      if (round2(num(p.stock)) !== total) { p.stock = total; fixed++; await this.save('products', p, state, true); }
    }
    UI.toast(fixed ? `Recalculated stock for ${fixed} item(s)` : 'Stock already matches the movement history ✓');
  },

  async savePayment(pay, state) {
    await this.save('payments', pay, state, true);
    UI.toast(`Payment ${money(pay.amount)} recorded ✓`);
    return pay;
  }
};

const UI = {
  toasts: [],
  toast(msg, kind = 'ok', ms = 3000) {
    const id = uid('t');
    this.toasts.push({ id, msg, kind });
    this.renderToasts();
    setTimeout(() => { this.toasts = this.toasts.filter((t) => t.id !== id); this.renderToasts(); }, ms);
  },
  renderToasts() {
    const host = document.getElementById('toasts');
    if (!host) return;
    host.innerHTML = this.toasts.map((t) => `<div class="toast ${t.kind}">${icon(t.kind === 'ok' ? 'check' : t.kind === 'warn' ? 'warn' : 'warn')}<span>${esc(t.msg)}</span></div>`).join('');
  },
  syncBadge() {
    const el = document.getElementById('sync-badge');
    if (!el) return;
    const dots = ACT.saving ? `<span class="dot busy"></span>` : '';
    if (DB.mode === 'firebase') {
      el.className = 'badge live';
      el.innerHTML = `${dots}${icon('cloud')}<span>${DB.user ? 'Synced' : 'Signed out'}</span>`;
    } else {
      el.className = 'badge local';
      el.innerHTML = `${icon('warn')}<span>Local only</span>`;
    }
  },

  /* ---------------- modal ---------------- */
  modal: null,
  openModal(title, bodyHTML, opts = {}) {
    this.modal = { title, body: bodyHTML, opts };
    this.renderModal();
  },
  closeModal() {
    this.modal = null;
    this.renderModal();
  },
  renderModal() {
    const host = document.getElementById('modal-host');
    if (!host) return;
    if (!this.modal) { host.innerHTML = ''; host.classList.remove('open'); return; }
    const wide = this.modal.opts.wide ? ' wide' : '';
    host.classList.add('open');
    host.innerHTML = `<div class="modal-back" data-act="modal-close"></div>
      <div class="modal${wide}">
        <div class="modal-head"><h3>${esc(this.modal.title)}</h3>
          <button class="icon-btn" data-act="modal-close" aria-label="Close">${icon('close')}</button></div>
        <div class="modal-body">${this.modal.body}</div>
      </div>`;
  }
};

/* ---------------- event delegation ---------------- */
const ACTIONS = {};
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  e.preventDefault();
  fn(el, e);
});
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-change]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.change];
  if (!fn) return;
  fn(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  const fn = ACTIONS[el.dataset.input];
  if (!fn) return;
  fn(el, e);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && UI.modal) UI.closeModal();
  if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
    const s = document.querySelector('[data-search-focus]');
    if (s) { e.preventDefault(); s.focus(); }
  }
});

const $ = (sel, root) => (root || document).querySelector(sel);
const $$ = (sel, root) => Array.from((root || document).querySelectorAll(sel));

];

function taxOpts() {
  return {
    taxEnabled: !!S.settings.taxEnabled,
    priceIncludesTax: !!S.settings.priceIncludesTax,
    roundOff: !!S.settings.roundOff
  };
}
function findCustomer(id) { return S.customers.find((c) => c.id === id) || null; }
function findProduct(id) { return S.products.find((p) => p.id === id) || null; }
function findInvoice(id) { return S.invoices.find((i) => i.id === id) || null; }
function optsCustomers() {
  return S.customers.slice().sort((a, b) => String(a.name).localeCompare(String(b.name)));
}
function nextBillNo() {
  let max = 0;
  S.invoices.forEach((i) => {
    const m = String(i.no || '').match(/(\d+)\s*$/);
    if (m) max = Math.max(max, parseInt(m[1], 10));
  });
  const n = Math.max(num(S.settings.nextInvoiceNo) || 1, max + 1);
  return String(S.settings.invoicePrefix || 'INV-') + String(n).padStart(4, '0');
}
function shellTotal() {
  return round2(S.invoices.reduce((s, i) => s + num(i.total), 0));
}
function receivableTotal() {
  return round2(S.customers.reduce((s, c) => s + Math.max(0, customerBalance(c, S.invoices, S.payments)), 0));
}
function advanceTotal() {
  return round2(S.customers.reduce((c, x) => s + Math.min(0, customerBalance(c, S.invoices, S.payments)), 0));
}

function clearShell() {
  ['hdr', 'nav', 'view'].forEach((id) => { const e = document.getElementById(id); if (e) e.innerHTML = ''; });
}
function splash(msg) {
  clearShell();
  document.getElementById('app').innerHTML = `<div class="splash"><div class="spin"></div><p>${esc(msg || 'Loading your shop data…')}</p></div>`;
}
function render() {
  if (S.portalMode) return renderPortal();          // portal owns the screen
  if (S.authRequired && !DB.user) return renderLogin();
  if (!S.ready) return splash();
  document.getElementById('app').innerHTML = '';
  renderHeader();
  renderNav();
  renderView();
  UI.syncBadge();
  UI.renderToasts();
  if (UI.modal) UI.renderModal();
}

function renderHeader() {
  const el = document.getElementById('hdr');
  const s = S.settings;
  const localWarn = DB.mode !== 'firebase';
  el.innerHTML = `
    <div class="hdr-in">
      <div class="hdr-left">

function renderNav() {
  const el = document.getElementById('nav');
  // A tab the login may not open stays put and renderView shows the "No access" card,
  // so a blocked screen always explains itself instead of silently jumping to Home.
  const allowed = NAV.filter((n) => canOpenView(n.id));
  el.innerHTML = allowed.map((n) => `<button class="nav-item ${S.tab === n.id ? 'active' : ''}" data-act="tab" data-tab="${n.id}">
      ${icon(n.ic)}<span>${n.label}</span></button>`).join('');
}

function renderView() {
  if (!canOpenView(S.tab)) {
    document.getElementById('view').innerHTML = `<div class="view">${card('', `
      <div class="empty">${icon('lock')}
        <p><b>No access</b><br>Your login (${esc(sessionLabel())}) does not have permission for this screen.<br>
        Ask the shop owner if you need it.</p>
        <button class="btn" data-act="tab" data-tab="dash">Back to Home</button></div>`)}</div>`;
    return;
  }
  const v = VIEWS[S.tab] || VIEWS.dash;
  const host = document.getElementById('view');
  host.innerHTML = v();
  host.scrollTop = 0;
  if (S.tab !== 'bill') window.scrollTo({ top: 0 });
  if (VIEWS[`_after_${S.tab}`]) VIEWS[`_after_${S.tab}`]();
}

ACTIONS.tab = (el) => { S.tab = el.dataset.tab; S.filters.prod.q = ''; render(); };
ACTIONS['go-settings'] = () => { S.tab = 'settings'; render(); };
ACTIONS['modal-close'] = () => UI.closeModal();

/* ---------------- shared components ---------------- */
function kpi(label, value, sub, tone, act, actData) {
  return `<div class="kpi ${tone || ''}" ${act ? `data-act="${act}" ${actData || ''} role="button" tabindex="0"` : ''}>
    <div class="kpi-label">${esc(label)}</div>
    <div class="kpi-value">${value}</div>
    ${sub ? `<div class="kpi-sub">${sub}</div>` : ''}
  </div>`;
}
function card(title, body, extra) {
  return `<section class="card">
    ${title ? `<div class="card-head"><h3>${title}</h3>${extra || ''}</div>` : extra ? `<div class="card-head">${extra}</div>` : ''}
    ${body}</section>`;
}
function emptyState(msg, actionLabel, action, icName) {
  return `<div class="empty">${icon(icName || 'box')}<p>${esc(msg)}</p>
    ${actionLabel ? `<button class="btn" data-act="${action}">${actionLabel}</button>` : ''}</div>`;
}
function statusPill(status) {
  const map = { paid: ['Paid', 'ok'], partial: ['Partial', 'warn'], unpaid: ['Unpaid', 'bad'], credit: ['Credit', 'warn'] };
  const m = map[status] || [status, ''];
  return `<span class="pill ${m[1]}">${m[0]}</span>`;
}
function customerOptions(selected) {
  return `<option value="">— Cash / Walk-in customer —</option>` + optsCustomers().map((c) =>
    `<option value="${c.id}" ${c.id === selected ? 'selected' : ''}>${esc(c.name)}${c.phone ? ' · ' + esc(c.phone) : ''}</option>`
  ).join('');
}
function productOptions(selected) {
  return `<option value="">— choose item —</option>` + S.products.slice().sort((a, b) => a.name.localeCompare(b.name)).map((p) =>
    `<option value="${p.id}" ${p.id === selected ? 'selected' : ''}>${esc(p.name)}${p.code ? ' [' + esc(p.code) + ']' : ''} — ${packDisplay(p.stock, p.ppb, p.unit)}</option>`
  ).join('');
}
/** grouped list of moves for one product */
function productHistory(productId) {
  return (S.moves || []).filter((m) => m.productId === productId).sort((a, b) => (a.date < b.date ? 1 : -1));
}
function typeLabel(t) {
  return ({ sale: 'Sold', purchase: 'Stock in', reverse: 'Bill cancelled', adjust: 'Adjust', return: 'Return' })[t] || t;
}
